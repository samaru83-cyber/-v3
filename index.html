const { listCustomers } = __req('store');
const { getSettings } = __req('db');
const { bucketOf, weekRange, today, fmtShort, esc, addDays, ddayLabel, daysLeft, fmtMoney, relTime } = __req('utils');
const { icon, siteTabs, bindSiteTabs, customerCard, bindCards, emptyState, toast } = __req('ui');
const { liveSchedule, isPayKind, toggleSchedule } = __req('store');
const { visibleCustomers, sendReportFile } = __req('team');

const SECTIONS = [
  { key: 'overdue', title: '기한 지남', dot: 'over' },
  { key: 'today', title: '오늘', dot: 'today' },
  { key: 'soon', title: '3일 이내', dot: 'soon' },
  { key: 'later', title: '이후', dot: 'later', limit: 15 },
  { key: 'none', title: '관리일 미지정', dot: 'none', limit: 10 },
];
const expanded = new Set();
let bannerClosed = false;

async function render(el, ctx) {
  const s = await getSettings();
  const all = visibleCustomers(await listCustomers(), s);
  const { html: tabs, filtered } = await siteTabs(all);
  const t = today();
  const [ws, we] = weekRange(t);

  const groups = { overdue: [], today: [], soon: [], later: [], none: [] };
  filtered.forEach((c) => groups[bucketOf(c.nextDate)].push(c));
  Object.values(groups).forEach((g) => g.sort((a, b) => (a.nextDate || '').localeCompare(b.nextDate || '') || a.name.localeCompare(b.name, 'ko')));
  const week = filtered.filter((c) => c.nextDate && c.nextDate >= ws && c.nextDate <= we).length;
  const nToday = groups.today.length, nOver = groups.overdue.length;

  const banner = (!bannerClosed && (nToday || nOver)) ? `
    <div class="banner">${icon('bell')}
      <div>오늘 관리할 고객 <b>${nToday}명</b>${nOver ? ` · 밀린 고객 <b>${nOver}명</b>` : ''}</div>
      <button class="x" aria-label="닫기" id="banner-x">${icon('x', 'sm')}</button></div>` : '';

  // 오늘·내일 방문 예약 + 계약·입금 일정(지연 + 7일 이내)
  const tm = addDays(t, 1), wk = addDays(t, 7);
  const visits = filtered.filter((c) => c.visitDate === t || c.visitDate === tm)
    .sort((a, b) => (a.visitDate + (a.visitTime || '99')).localeCompare(b.visitDate + (b.visitTime || '99')));
  const sched = [];
  filtered.forEach((c) => liveSchedule(c).forEach((it) => { if (!it.done && it.date && it.date <= wk) sched.push({ c, it }); }));
  sched.sort((a, b) => a.it.date.localeCompare(b.it.date));
  const agenda = (visits.length || sched.length) ? `
    <div class="agenda">
      ${visits.length ? `<section class="section"><div class="section-title">${icon('clock', 'sm')} 방문 예약<span class="cnt">${visits.length}</span></div>
        ${visits.map((c) => `<a class="ag-row ${c.visitDone ? 'muted' : ''}" href="#/c/${c.id}"><span class="ag-time ${c.visitDate === t ? 'today' : ''}">${c.visitDate === t ? '오늘' : '내일'}<b>${esc(c.visitTime || '미정')}</b></span>
          <span class="ag-body"><b>${esc(c.name)}</b><small>${esc([c.site, c.unitType].filter(Boolean).join(' · '))}</small></span>${c.visitDone ? '<span class="ok-txt">✓ 방문</span>' : ''}</a>`).join('')}</section>` : ''}
      ${sched.length ? `<section class="section"><div class="section-title">${icon('won', 'sm')} 계약·입금 일정<span class="cnt">${sched.length}</span></div>
        ${sched.map(({ c, it }) => { const n = daysLeft(it.date); return `<div class="ag-row" data-goto="${c.id}"><span class="ag-time ${n < 0 ? 'over' : n === 0 ? 'today' : ''}">${ddayLabel(it.date)}<b>${fmtShort(it.date).replace(/\(.\)/, '')}</b></span>
          <span class="ag-body"><b>${esc(c.name)} · ${esc(it.kind)}</b><small>${esc([c.unit, fmtMoney(it.amount)].filter(Boolean).join(' · '))}</small></span>
          <button class="btn btn-sm" data-sch="${c.id}|${it.id}">${isPayKind(it.kind) ? '입금 확인' : '완료'}</button></div>`; }).join('')}</section>` : ''}
    </div>` : '';
  const reportedToday = s.lastReportAt && s.lastReportAt.slice(0, 10) === t;
  const reportBanner = s.mode === 'staff' && !reportedToday && all.length ? `
    <div class="banner warn-banner">${icon('send')}<div>오늘 팀장님께 보고 전입니다${s.lastReportAt ? ` <small>(마지막 ${relTime(s.lastReportAt)})</small>` : ''}</div>
      <button class="btn btn-sm" id="report-now">보고 보내기</button></div>` : '';

  const greet = s.agentName ? `${esc(s.agentName)}님, ` : '';
  el.innerHTML = `
    <div class="page-head"><h1>관리 대시보드</h1><span class="sub">${fmtShort(t)}</span></div>
    ${tabs}
    ${reportBanner}
    ${banner}
    <div class="stats">
      <div class="stat today" data-jump="today"><div class="label">오늘 관리</div><div class="num">${nToday}</div></div>
      <div class="stat over" data-jump="overdue"><div class="label">기한 지남</div><div class="num">${nOver}</div></div>
      <div class="stat" data-jump="soon"><div class="label">이번 주</div><div class="num">${week}</div></div>
      <div class="stat" data-href="#/customers"><div class="label">전체 고객</div><div class="num">${filtered.length}</div></div>
    </div>
    ${agenda}
    <div id="secs"></div>`;

  const secs = el.querySelector('#secs');
  if (!all.length) {
    secs.innerHTML = emptyState('📋', `${greet}첫 고객을 등록해 보세요`, '+ 버튼으로 고객을 추가하면 관리일에 맞춰 여기에 정리됩니다. 설정에서 샘플 고객 10명을 넣어 미리 써볼 수도 있습니다.',
      `<div class="btn-row"><a class="btn btn-primary" href="#/new">고객 등록</a><a class="btn" href="#/settings">샘플 넣기</a></div>`);
  } else if (!nToday && !nOver && !groups.soon.length && !groups.later.length && !groups.none.length) {
    secs.innerHTML = emptyState('✅', '이 현장에는 고객이 없습니다', '현장 탭을 바꾸거나 고객을 추가하세요.');
  } else {
    secs.innerHTML = SECTIONS.map((sec) => {
      const list = groups[sec.key];
      if (!list.length) {
        if (sec.key === 'overdue' || sec.key === 'none' || sec.key === 'later') return '';
        return `<section class="section" id="sec-${sec.key}"><div class="section-title"><span class="dot ${sec.dot}"></span>${sec.title}<span class="cnt">0</span></div>
          <div style="color:var(--text-3);font-size:14px;padding:4px 2px 4px">${sec.key === 'today' ? '오늘 관리할 고객이 없습니다 👍' : '예정된 고객이 없습니다'}</div></section>`;
      }
      const lim = sec.limit && !expanded.has(sec.key) ? sec.limit : Infinity;
      return `<section class="section" id="sec-${sec.key}">
        <div class="section-title"><span class="dot ${sec.dot}"></span>${sec.title}<span class="cnt">${list.length}</span></div>
        ${list.slice(0, lim).map(customerCard).join('')}
        ${list.length > lim ? `<button class="more" data-more="${sec.key}">${list.length - lim}명 더 보기</button>` : ''}
      </section>`;
    }).join('') + `<p style="text-align:center;color:var(--text-3);font-size:12px;margin-top:4px">카드를 오른쪽으로 밀거나 ✓ 를 누르면 관리 완료</p>`;
  }

  bindCards(el, ctx.rerender);
  bindSiteTabs(el, ctx.rerender);
  el.querySelectorAll('[data-more]').forEach((b) => { b.onclick = () => { expanded.add(b.dataset.more); ctx.rerender(); }; });
  el.querySelectorAll('[data-jump]').forEach((b) => {
    b.onclick = () => {
      const target = el.querySelector(`#sec-${b.dataset.jump}`);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
  });
  el.querySelectorAll('[data-href]').forEach((b) => { b.onclick = () => { location.hash = b.dataset.href; }; });
  el.querySelectorAll('[data-goto]').forEach((r) => { r.onclick = (e) => { if (!e.target.closest('button')) location.hash = `#/c/${r.dataset.goto}`; }; });
  el.querySelectorAll('[data-sch]').forEach((b) => {
    b.onclick = async () => { const [cid, sid] = b.dataset.sch.split('|'); await toggleSchedule(cid, sid, true); toast(`${b.textContent} 처리했습니다`); ctx.rerender(); };
  });
  const rn = el.querySelector('#report-now');
  if (rn) rn.onclick = async () => { const n = await sendReportFile(); toast(`보고 파일을 만들었습니다 (손님 ${n}명)`); ctx.rerender(); };
  const bx = el.querySelector('#banner-x');
  if (bx) bx.onclick = () => { bannerClosed = true; ctx.rerender(); };
}

Object.assign(__exp, { render });
};

  const sitesEl = el.querySelector('#sites');
  const saveSites = debounce(async () => { await saveSettings({ sites: sites.filter((x) => x.name.trim()) }); toast('저장됨'); }, 600);
  const drawSites = () => {
    sitesEl.innerHTML = sites.length ? sites.map((x, i) => `
      <div class="site-item">
        <input data-i="${i}" data-f="name" value="${esc(x.name)}" placeholder="현장명">
        <button class="icon-btn" data-rm="${i}" aria-label="현장 삭제">${icon('trash', 'sm')}</button>
        <input class="addr" data-i="${i}" data-f="address" value="${esc(x.address || '')}" placeholder="견본주택 주소">
      </div>`).join('') : '<div style="color:var(--text-3);font-size:14px">등록된 현장이 없습니다. 현장을 2개 이상 등록하면 화면 위에 현장 탭이 생깁니다.</div>';
    sitesEl.querySelectorAll('input').forEach((inp) => {
      inp.addEventListener('input', () => { sites[inp.dataset.i][inp.dataset.f] = inp.value; saveSites(); });
    });
    sitesEl.querySelectorAll('[data-rm]').forEach((b) => {
      b.onclick = async () => {
        const x = sites[b.dataset.rm];
        const used = customers.filter((c) => c.site === x.name).length;
        if (used && !(await confirmSheet({ title: `'${x.name}' 현장을 목록에서 뺄까요?`, message: `이 현장 고객 ${used}명의 정보는 그대로 유지됩니다.`, ok: '빼기' }))) return;
        sites.splice(b.dataset.rm, 1); drawSites(); saveSites();
      };
    });
  };
  drawSites();
  el.querySelector('#add-site').onclick = () => { sites.push({ name: '', address: '' }); drawSites(); sitesEl.querySelector(`[data-i="${sites.length - 1}"]`).focus(); };

  // ---- 관리주기 ----
  el.querySelectorAll('[data-cycle]').forEach((inp) => {
    inp.addEventListener('change', async () => {
      const v = Math.max(1, Math.min(365, parseInt(inp.value, 10) || 1));
      inp.value = v;
      const cur = await getSettings();
      await saveSettings({ cycles: { ...cur.cycles, [inp.dataset.cycle]: v } });
      toast(`${inp.dataset.cycle}등급 주기 ${v}일로 저장`);
    });
  });

  // ---- 콜 종류 ----
  el.querySelectorAll('[data-ck]').forEach((b) => {
    b.onclick = async () => {
      const kinds = [...s.callKinds];
      kinds.splice(Number(b.dataset.ck), 1);
      await saveSettings({ callKinds: kinds });
      toast('콜 종류를 지웠습니다'); ctx.rerender();
    };
  });
  const ckAdd = async () => {
    const inp = el.querySelector('#ck-new');
    const v = inp.value.trim();
    if (!v) return;
    if (s.callKinds.includes(v)) { toast('이미 있는 종류입니다'); return; }
    await saveSettings({ callKinds: [...s.callKinds, v] });
    toast(`'${v}' 추가`); ctx.rerender();
  };
  el.querySelector('#ck-add')?.addEventListener('click', ckAdd);
  el.querySelector('#ck-new')?.addEventListener('keydown', (e) => { if (e.key === 'Enter') ckAdd(); });

  // ---- 테마 ----
  el.querySelectorAll('#theme button').forEach((b) => {
    b.onclick = async () => {
      await saveSettings({ theme: b.dataset.v });
      applyTheme(b.dataset.v);
      el.querySelectorAll('#theme button').forEach((x) => x.classList.toggle('on', x === b));
    };
  });

  // ---- 백업 ----
  el.querySelector('#exp-json').onclick = async () => {
    const data = { app: 'bunyang-crm', version: 1, exportedAt: new Date().toISOString(), customers: await listCustomers(), templates: await listTemplates(), calls: await listCalls(), settings: await getSettings() };
    await saveFile(`고객관리_백업_${today().replace(/-/g, '')}.json`, JSON.stringify(data, null, 1), 'application/json');
    await saveSettings({ lastBackup: new Date().toISOString() });
    toast(`고객 ${data.customers.length}명 백업 파일을 만들었습니다`);
    ctx.rerender();
  };
  el.querySelector('#exp-csv').onclick = async () => {
    const list = (await listCustomers()).sort((a, b) => a.name.localeCompare(b.name, 'ko'));
    await saveFile(`고객목록_${today().replace(/-/g, '')}.csv`, '﻿' + toCSV(list), 'text/csv');
    toast(`고객 ${list.length}명을 CSV로 내보냈습니다`);
  };
  const fileInput = el.querySelector('#file');
  el.querySelector('#imp-json').onclick = () => fileInput.click();
  fileInput.onchange = async () => {
    const f = fileInput.files[0];
    fileInput.value = '';
    if (!f) return;
    let data;
    try { data = JSON.parse(await f.text()); } catch (e) { toast('백업 파일을 읽을 수 없습니다'); return; }
    if (data.app !== 'bunyang-crm' || !Array.isArray(data.customers)) { toast('이 앱의 백업 파일이 아닙니다'); return; }
    if (data.type === 'assign' || data.type === 'report') { toast(`${data.type === 'assign' ? '배정' : '보고'} 파일입니다. 파일 주고받기 화면에서 불러오세요`); return; }
    importSheet(data, ctx);
  };

  // ---- 설치 안내 ----
  const inst = el.querySelector('#install');
  if (standalone) inst.innerHTML = '<div style="color:var(--ok);font-weight:600">✓ 홈 화면 앱으로 실행 중입니다</div>';
  else if (window.__installPrompt) {
    inst.innerHTML = `<button class="btn btn-primary btn-block" id="do-install">${icon('download')} 홈 화면에 설치</button>`;
    inst.querySelector('#do-install').onclick = async () => {
      window.__installPrompt.prompt();
      await window.__installPrompt.userChoice;
      window.__installPrompt = null; ctx.rerender();
    };
  } else if (isIOS()) {
    inst.innerHTML = '<ol style="margin:0;padding-left:20px;line-height:1.8;font-size:14px"><li>Safari 아래쪽 <b>공유 버튼(□↑)</b>을 누르세요</li><li><b>홈 화면에 추가</b>를 고르세요</li><li>오른쪽 위 <b>추가</b>를 누르면 끝</li></ol>';
  } else {
    inst.innerHTML = '<div style="font-size:14px;line-height:1.7">Chrome 오른쪽 위 <b>⋮ 메뉴 → 홈 화면에 추가</b>(또는 <b>앱 설치</b>)를 누르세요.</div>';
  }

  // ---- 샘플·초기화 ----
  const sa = el.querySelector('#sample-add');
  if (sa) sa.onclick = async () => { await loadSampleData(); toast('샘플 고객 10명을 넣었습니다'); ctx.rerender(); };
  const sd = el.querySelector('#sample-del');
  if (sd) sd.onclick = async () => {
    if (await confirmSheet({ title: '샘플 고객을 지울까요?', message: '직접 등록한 고객은 그대로 남습니다.', ok: '지우기' })) { await removeSampleData(); toast('샘플 고객을 지웠습니다'); ctx.rerender(); }
  };
  el.querySelector('#wipe').onclick = async () => {
    if (!(await confirmSheet({ title: '모든 데이터를 삭제할까요?', message: `고객 ${customers.length}명, 템플릿, 설정이 모두 지워지며 되돌릴 수 없습니다. 먼저 백업하세요.`, ok: '모두 삭제', danger: true }))) return;
    if (!(await confirmSheet({ title: '정말 삭제합니다', message: '마지막 확인입니다.', ok: '삭제', danger: true }))) return;
    await Promise.all(['customers', 'templates', 'settings', 'calls'].map((x) => db.clear(x)));
    location.hash = '#/home'; location.reload();
  };
}

function importSheet(data, ctx) {
  const n = data.customers.length, tn = (data.templates || []).length;
  const { el, close } = openSheet(`
    <h2>백업 불러오기</h2>
    <p class="sheet-sub">${data.exportedAt ? fmtDate(data.exportedAt.slice(0, 10)) + ' 백업 · ' : ''}고객 ${n}명, 템플릿 ${tn}개</p>
    <div style="display:grid;gap:8px">
      <button class="btn btn-primary" data-m="merge" style="flex-direction:column;gap:0;min-height:60px">합치기<small style="font-weight:500;opacity:.85">지금 데이터는 두고, 백업 내용을 추가·갱신</small></button>
      <button class="btn" data-m="replace" style="flex-direction:column;gap:0;min-height:60px;color:var(--danger)">전부 바꾸기<small style="font-weight:500;opacity:.85">지금 데이터를 지우고 백업으로 교체</small></button>
      <button class="btn" data-m="cancel">취소</button>
    </div>`);
  el.querySelectorAll('[data-m]').forEach((b) => {
    b.onclick = async () => {
      const m = b.dataset.m;
      close();
      if (m === 'cancel') return;
      if (m === 'replace') {
        if (!(await confirmSheet({ title: '지금 데이터를 모두 지울까요?', message: '현재 고객과 템플릿이 백업 내용으로 교체됩니다.', ok: '바꾸기', danger: true }))) return;
        await db.clear('customers'); await db.clear('templates'); await db.clear('calls');
      }
      if (Array.isArray(data.calls)) await db.putMany('calls', data.calls.filter((x) => x && x.id));
      const clean = data.customers.filter((c) => c && c.id && c.name).map((c) => ({ ...c, phoneDigits: digitsOnly(c.phone) }));
      await db.putMany('customers', clean);
      if (tn) await db.putMany('templates', data.templates.filter((t) => t && t.id));
      if (data.settings) {
        const cur = await getSettings();
        if (m === 'replace') await saveSettings({ ...data.settings, key: 'app', seeded: true });
        else {
          const sites = [...(cur.sites || [])];
          (data.settings.sites || []).forEach((x) => { if (!sites.some((y) => y.name === x.name)) sites.push(x); });
          await saveSettings({ sites, agentName: cur.agentName || data.settings.agentName || '', agentPhone: cur.agentPhone || data.settings.agentPhone || '', defaultAddress: cur.defaultAddress || data.settings.defaultAddress || '' });
        }
      }
      toast(`고객 ${clean.length}명을 불러왔습니다`);
      ctx.rerender();
    };
  });
}

function toCSV(list) {
  const cols = ['이름', '연락처', '현장', '관심타입', '동호수', '등급', '유입경로', '최초상담일', '최근접촉일', '다음관리일', '방문일', '태그', '관리메모', '상담히스토리'];
  const q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = list.map((c) => [
    c.name, c.phone, c.site, c.unitType, c.unit, c.grade, c.source, c.firstDate, c.lastContact, c.nextDate, c.visitDate,
    (c.tags || []).join(', '), c.memo,
    (c.history || []).map((h) => `${h.date} [${h.kind}] ${h.text}`).join('\n'),
  ].map(q).join(','));
  return [cols.map(q).join(','), ...rows].join('\r\n');
}

/** 파일 저장: iPhone은 공유 시트(파일에 저장/카톡 등), 그 외는 다운로드 */
async function saveFile(name, text, type) {
  const blob = new Blob([text], { type: `${type};charset=utf-8` });
  if (isIOS() && navigator.canShare) {
    const file = new File([blob], name, { type });
    if (navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

Object.assign(__exp, { render });
};

function leadStep(step, s) {

    if (!name) { toast('이름을 입력하세요'); return; }

    await saveSettings({ mode: 'lead', agentName: name, agentPhone: step.querySelector('#ph').value, staff });

function staffStep(step, s) {
  step.innerHTML = `

    location.hash = '#/home';
  };

async function soloStep() {
  await saveSettings({ mode: 'solo' });
  await buildNav(true);

__defs['views/sms'] = function (__exp) {

  };
  el.querySelectorAll('[data-cat]').forEach((b) => {
    b.onclick = () => {
      cat = b.dataset.cat;
      try { sessionStorage.setItem('tplCat', cat); } catch (e) { /* 무시 */ }
      el.querySelectorAll('[data-cat]').forEach((x) => x.classList.toggle('on', x === b));
      drawTpls();
    };
  });
  drawTpls();

  // 고객 검색 → 문자 생성
  const cres = el.querySelector('#cres');
  const drawCust = () => {
    const q = el.querySelector('#cq').value.trim().toLowerCase();
    const qd = digitsOnly(q);
    if (!q) {
      // 검색 전엔 오늘·기한 지남 고객을 바로가기로
      const t = today();
      const due = customers.filter((c) => c.nextDate && c.nextDate <= t).slice(0, 5);
      cres.innerHTML = due.length ? `<div style="font-size:13px;color:var(--text-2);margin:4px 2px 6px">오늘 관리 대상</div>` + due.map(custRow).join('') : '';
    } else {
      const list = customers.filter((c) => c.name.toLowerCase().includes(q) || (qd.length >= 3 && c.phoneDigits.includes(qd))).slice(0, 8);
      cres.innerHTML = list.map(custRow).join('') || '<div style="color:var(--text-3);font-size:14px;padding:6px 2px">일치하는 고객이 없습니다</div>';
    }
    cres.querySelectorAll('[data-cid]').forEach((r) => {
      r.onclick = async () => composeSheet(await getCustomer(r.dataset.cid), ctx.rerender);
    });
  };
  el.querySelector('#cq').addEventListener('input', debounce(drawCust, 120));
  drawCust();
}

const custRow = (c) => `<div class="row" data-cid="${c.id}" style="margin-bottom:6px;padding:10px 12px">
  <div class="body"><div class="name">${esc(c.name)} ${gradeBadge(c.grade)}</div><div class="meta">${esc(c.phone)} · ${esc(c.site || '')}</div></div>
  ${icon('send', 'sm')}</div>`;

// ---- 템플릿 편집 ----
async function renderEditor(el, ctx) {
  const id = ctx.params[0];
  const isNew = !id || id === 'new';
  const tpls = await listTemplates();
  const t = isNew ? { category: TEMPLATE_CATEGORIES[0], title: '', body: '', favorite: false } : tpls.find((x) => x.id === id);
  if (!t) { go('#/sms'); return; }
  const s = await getSettings();
  const sample = (await listCustomers())[0] || { name: '홍길동', site: s.sites[0]?.name || '○○현장', unitType: '84A', visitDate: addDays(today(), 1) };

  el.innerHTML = `
    <div class="page-head">
      <button class="icon-btn back" id="back" aria-label="뒤로">${icon('left')}</button>
      <h1>${isNew ? '템플릿 추가' : '템플릿 수정'}</h1>
      <button class="star ${t.favorite ? 'on' : ''}" id="fav" aria-label="즐겨찾기">${icon('star')}</button>
    </div>
    <div class="card">
      <div class="field"><label>카테고리</label><select id="cat">${TEMPLATE_CATEGORIES.map((c) => `<option ${c === t.category ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
      <div class="field"><label>템플릿 이름</label><input id="title" value="${esc(t.title)}" placeholder="예: 주말 방문 감사"></div>
      <div class="field"><label>내용</label>
        <div class="chips wrap">${TEMPLATE_VARS.map((v) => `<button type="button" class="chip var-chip" data-var="${esc(v)}">${esc(v)}</button>`).join('')}</div>
        <textarea id="body" style="min-height:200px" placeholder="변수 버튼을 누르면 커서 위치에 들어갑니다">${esc(t.body)}</textarea></div>
    </div>
    <div class="card">
      <h3>미리보기 <span style="font-weight:500;color:var(--text-2);font-size:13px">(${esc(sample.name)} 고객 기준)</span></h3>
      <div id="pv" style="white-space:pre-wrap;font-size:15px;line-height:1.6;color:var(--text-2)"></div>
    </div>
    <button class="btn btn-primary btn-block" id="save" style="min-height:54px">${icon('check')} 저장</button>
    ${isNew ? '' : `<button class="btn btn-block btn-danger" id="del" style="margin-top:8px">${icon('trash', 'sm')} 삭제</button>`}`;

  const body = el.querySelector('#body');
  const pv = el.querySelector('#pv');
  const draw = () => {
    pv.innerHTML = esc(fillTemplate(body.value, sample, s)).replace(/\{[^{}]+\}/g, (m) => `<span class="miss" style="background:var(--warn-soft);color:var(--warn)">${m}</span>`) || '<span style="color:var(--text-3)">내용을 입력하세요</span>';
  };
  body.addEventListener('input', draw);
  draw();
  let fav = !!t.favorite;
  el.querySelector('#fav').onclick = (e) => { fav = !fav; e.currentTarget.classList.toggle('on', fav); };
  el.querySelectorAll('[data-var]').forEach((b) => {
    b.onclick = () => {
      const v = b.dataset.var, st = body.selectionStart ?? body.value.length, en = body.selectionEnd ?? st;
      body.value = body.value.slice(0, st) + v + body.value.slice(en);
      body.focus(); body.setSelectionRange(st + v.length, st + v.length); draw();
    };
  });
  el.querySelector('#back').onclick = () => go('#/sms');
  el.querySelector('#save').onclick = async () => {
    const title = el.querySelector('#title').value.trim();
    if (!title || !body.value.trim()) { toast('이름과 내용을 입력하세요'); return; }
    await saveTemplate({ ...t, category: el.querySelector('#cat').value, title, body: body.value, favorite: fav });
    toast('템플릿을 저장했습니다');
    go('#/sms');
  };
  const del = el.querySelector('#del');
  if (del) del.onclick = async () => {
    if (await confirmSheet({ title: `'${t.title}' 템플릿을 삭제할까요?`, ok: '삭제', danger: true })) { await deleteTemplate(t.id); toast('삭제했습니다'); go('#/sms'); }
  };
}

// ---- 문자 생성 시트 (고객 상세 / 문자 탭에서 호출) ----
async function composeSheet(c, onChange) {
  if (!c) return;
  const [tpls, s] = await Promise.all([listTemplates(), getSettings()]);
  // 상황에 맞는 템플릿 먼저 추천: 내일 방문 → 리마인드, 계약 → 계약 축하
  const pick = (cat) => tpls.find((t) => t.category === cat);
  const tm = addDays(today(), 1);
  let cur = (c.visitDate === tm && pick('방문 전날 리마인드')) || (c.grade === '계약' && pick('계약 축하')) || tpls[0];
  let logged = false;
  const { el, close } = openSheet(`
    <h2>${esc(c.name)}님께 문자</h2>
    <p class="sheet-sub">${esc(c.phone)} · 템플릿을 고르면 내용이 자동으로 채워집니다</p>
    <div class="chips" id="tchips">${tpls.map((t) => `<button class="chip ${cur && t.id === cur.id ? 'on' : ''}" data-t="${t.id}">${t.favorite ? '★ ' : ''}${esc(t.title)}</button>`).join('')}</div>
    <textarea class="preview" id="msg"></textarea>
    <p class="miss-note hidden" id="miss"></p>
    <div class="btn-row" style="margin-top:12px">
      <button class="btn" id="copy">${icon('copy')} 복사</button>
      <button class="btn btn-primary" id="open">${icon('send')} 문자앱 열기</button>
    </div>`);
  const msg = el.querySelector('#msg');
  const missEl = el.querySelector('#miss');
  const showMissing = () => {
    const miss = missingVars(msg.value);
    missEl.textContent = miss.length ? `채워지지 않은 항목: ${miss.join(' ')} — 고객 정보나 설정에서 입력하거나 직접 고쳐 주세요.` : '';
    missEl.classList.toggle('hidden', !miss.length);
  };
  const apply = () => { msg.value = cur ? fillTemplate(cur.body, c, s) : ''; showMissing(); };
  msg.addEventListener('input', () => { msg.dataset.dirty = '1'; showMissing(); });
  el.querySelectorAll('[data-t]').forEach((b) => {
    b.onclick = () => {
      if (msg.dataset.dirty && !confirm('수정한 내용이 사라집니다. 템플릿을 바꿀까요?')) return;
      cur = tpls.find((t) => t.id === b.dataset.t);
      el.querySelectorAll('[data-t]').forEach((x) => x.classList.toggle('on', x === b));
      delete msg.dataset.dirty; apply();
    };
  });
  apply();
  const onChip = el.querySelector('#tchips .chip.on');
  if (onChip) setTimeout(() => onChip.scrollIntoView({ inline: 'center', block: 'nearest' }), 280);

  const log = async () => {
    if (logged) return;
    logged = true;
    await addHistory(c.id, { kind: '문자', text: `문자발송: ${cur ? cur.title : '직접 작성'}` }, { next: 'keep' });
    onChange && onChange();
  };
  const afterToast = (m) => toast(m, { label: '관리 완료', run: () => doneSheet(c.id, onChange) });

  el.querySelector('#copy').onclick = async () => {
    if (await copyText(msg.value)) { await log(); afterToast('복사했습니다 · 히스토리에 기록됨'); }
    else toast('복사에 실패했습니다. 길게 눌러 직접 복사하세요');
  };
  el.querySelector('#open').onclick = async () => {
    const link = smsLink(c.phone, msg.value);
    await log();
    close();
    afterToast('문자앱을 열었습니다 · 히스토리에 기록됨');
    location.href = link;
  };
}

Object.assign(__exp, { render, composeSheet });
};

__defs['views/sync'] = function (__exp) {
// 파일 주고받기: (팀장) 배정 파일 보내기 · 보고 파일 받기 · 엑셀 가져오기 / (직원) 보고 보내기 · 배정 받기
const { getSettings } = __req('db');
const { listCustomers } = __req('store');
const { esc, relTime, today } = __req('utils');
const { icon, toast, confirmSheet } = __req('ui');
const { readPackage, importAssign, importReport, sendAssignFile, sendReportFile, previewCSV, commitCSV } = __req('team');
const { buildNav } = __req('app');

async function render(el, ctx) {
  const s = await getSettings();
  if (s.mode === 'lead') return renderLead(el, ctx, s);
  if (s.mode === 'staff') return renderStaff(el, ctx, s);
  location.replace('#/settings');
}

// ---------------- 팀장 ----------------
async function renderLead(el, ctx, s) {
  const all = await listCustomers();
  const cnt = (id) => all.filter((c) => c.owner === id).length;
  const t = today();
  el.innerHTML = `
    <div class="page-head"><h1>파일 주고받기</h1></div>
    <div class="flow">
      <div><b>1</b>팀장이 손님 등록·배정</div><span>→</span>
      <div><b>2</b>직원별 <u>배정 파일</u>을 카톡으로 전송</div><span>→</span>
      <div><b>3</b>직원이 관리 후 <u>보고 파일</u> 전송</div><span>→</span>
      <div><b>4</b>팀장 PC에 끌어다 놓으면 합쳐짐</div>
    </div>

    <div class="dash-grid">
      <section class="panel">
        <div class="panel-head">${icon('download', 'sm')} 직원에게 배정 파일 보내기</div>
        ${s.staff.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>직원</th><th>담당 손님</th><th>마지막 배정 파일</th><th></th></tr></thead><tbody>
          ${s.staff.map((st) => {
            const sy = s.staffSync[st.id] || {};
            return `<tr><td><b>${esc(st.name)}</b></td><td class="num">${cnt(st.id)}명</td><td class="sm">${sy.assignAt ? relTime(sy.assignAt) : '보낸 적 없음'}</td>
              <td><button class="btn btn-sm btn-primary" data-assign="${st.id}">파일 만들기</button></td></tr>`;
          }).join('')}</tbody></table></div>
          <button class="btn btn-block" id="assign-all" style="margin-top:10px">${icon('download', 'sm')} 모든 직원 파일 한번에 만들기</button>
          <p class="panel-note">만든 파일(배정_이름_날짜.json)을 카톡 PC버전으로 직원에게 보내세요. 직원이 불러오면 그 직원 손님만 들어갑니다. 재배정한 손님은 이전 직원 휴대폰에서 자동으로 빠집니다.</p>`
        : '<div class="panel-empty">설정에서 직원을 먼저 등록하세요</div>'}
      </section>

      <section class="panel">
        <div class="panel-head">${icon('upload', 'sm')} 직원 보고 파일 받기</div>
        <label class="drop" id="drop">
          ${icon('upload')}<b>보고 파일을 여기에 끌어다 놓기</b><span>여러 개를 한꺼번에 놓아도 됩니다 · 클릭해서 선택</span>
          <input type="file" id="rep" accept=".json,application/json" multiple class="hidden">
        </label>
        <div id="rep-result"></div>
        <div class="tbl-wrap" style="margin-top:10px"><table class="tbl"><thead><tr><th>직원</th><th>최근 보고</th><th>받은 손님</th></tr></thead><tbody>
          ${s.staff.map((st) => {
            const sy = s.staffSync[st.id] || {};
            const ok = sy.reportAt && sy.reportAt.slice(0, 10) === t;
            return `<tr><td>${esc(st.name)}</td><td><span class="${ok ? 'ok-txt' : 'danger-txt'}">${sy.reportAt ? relTime(sy.reportAt) : '받은 적 없음'}</span></td><td class="num">${sy.count ?? '-'}</td></tr>`;
          }).join('')}</tbody></table></div>
        <p class="panel-note">같은 손님은 더 최근에 수정된 내용이 남고, 상담 히스토리는 합쳐집니다. 팀장이 한 입금 확인·재배정은 유지됩니다.</p>
      </section>

      <section class="panel wide">
        <div class="panel-head">${icon('file', 'sm')} 엑셀(CSV) 명단 가져오기</div>
        <p class="panel-note" style="margin-top:0">엑셀에서 <b>다른 이름으로 저장 → CSV</b>로 저장한 파일을 고르세요. 첫 줄 제목에 <b>이름, 연락처</b>가 꼭 있어야 하고,
          현장 · 관심타입 · 동호수 · 등급 · 유입경로 · 최초상담일 · 다음관리일 · 방문일 · 방문시간 · 메모 · <b>담당</b>(직원 이름) 열이 있으면 함께 들어갑니다.</p>
        <button class="btn" id="csv-pick">${icon('upload', 'sm')} CSV 파일 선택</button>
        <input type="file" id="csv" accept=".csv,text/csv,.txt" class="hidden">
        <div id="csv-preview"></div>
      </section>
    </div>`;

  // 배정 파일
  el.querySelectorAll('[data-assign]').forEach((b) => {
    b.onclick = async () => { const n = await sendAssignFile(b.dataset.assign); toast(`배정 파일 생성 · 손님 ${n}명`); ctx.rerender(); };
  });
  const aa = el.querySelector('#assign-all');
  if (aa) aa.onclick = async () => {
    for (const st of s.staff) { await sendAssignFile(st.id); await new Promise((r) => setTimeout(r, 400)); }
    toast(`직원 ${s.staff.length}명 배정 파일을 만들었습니다`); ctx.rerender();
  };

  // 보고 파일 (드래그 앤 드롭 + 선택)
  const drop = el.querySelector('#drop');
  const rep = el.querySelector('#rep');
  const handle = async (files) => {
    const out = [];
    for (const f of files) {
      try {
        const pkg = await readPackage(f);
        if (pkg.type === 'assign') { out.push(`<li class="danger-txt">${esc(f.name)}: 배정 파일입니다 (직원이 받는 파일)</li>`); continue; }
        if (pkg.type !== 'report') { out.push(`<li class="danger-txt">${esc(f.name)}: 보고 파일이 아닙니다. 전체 백업은 설정 → 백업에서 불러오세요</li>`); continue; }
        const r = await importReport(pkg);
        out.push(`<li class="ok-txt">✓ ${esc(r.staff)} · 새 손님 ${r.added}명, 갱신 ${r.updated}명${pkg.calls?.length ? `, 콜 ${pkg.calls.length}건` : ""} (${relTime(pkg.exportedAt)} 보고)</li>`);
      } catch (e) { out.push(`<li class="danger-txt">${esc(e.message)}</li>`); }
    }
    sessionStorage.setItem('repResult', out.join(''));
    await buildNav(true);
    ctx.rerender();
  };
  const last = sessionStorage.getItem('repResult');
  if (last) { el.querySelector('#rep-result').innerHTML = `<ul class="result">${last}</ul>`; sessionStorage.removeItem('repResult'); }
  rep.onchange = () => { const fs = [...rep.files]; rep.value = ''; if (fs.length) handle(fs); };
  ['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', (e) => { const fs = [...e.dataTransfer.files].filter((f) => /\.json$/i.test(f.name)); if (fs.length) handle(fs); });

  // CSV
  const csv = el.querySelector('#csv');
  el.querySelector('#csv-pick').onclick = () => csv.click();
  csv.onchange = async () => {
    const f = csv.files[0]; csv.value = '';
    if (!f) return;
    const box = el.querySelector('#csv-preview');
    try {
      const { rows } = await previewCSV(f);
      const dup = rows.filter((r) => r.dup).length;
      box.innerHTML = `
        <div style="margin:12px 0 8px;font-weight:700">${rows.length}명 읽음${dup ? ` · <span class="warn-txt">이미 있는 번호 ${dup}명</span>` : ''}</div>
        <div class="tbl-wrap" style="max-height:320px;overflow:auto"><table class="tbl"><thead><tr><th>이름</th><th>연락처</th><th>현장</th><th>타입</th><th>등급</th><th>담당</th><th></th></tr></thead><tbody>
          ${rows.slice(0, 200).map((r) => `<tr class="${r.dup ? 'muted' : ''}"><td>${esc(r.name)}</td><td>${esc(r.phone)}</td><td>${esc(r.site)}</td><td>${esc(r.unitType)}</td><td>${esc(r.grade)}</td>
            <td>${r.owner ? esc(r.ownerName) : r.ownerName ? `<span class="warn-txt">${esc(r.ownerName)}?</span>` : '-'}</td><td>${r.dup ? '<span class="warn-txt">중복</span>' : ''}</td></tr>`).join('')}
        </tbody></table></div>
        <div class="csv-opts">
          <label>담당 열이 비어 있는 손님 →
            <select id="csv-owner"><option value="">미배정</option>${s.staff.map((st) => `<option value="${st.id}">${esc(st.name)}</option>`).join('')}</select></label>
          <label class="check"><input type="checkbox" id="csv-skip" checked> 이미 있는 번호는 건너뛰기</label>
          <button class="btn btn-primary" id="csv-go">가져오기</button>
        </div>
        ${rows.some((r) => r.ownerName && !r.owner) ? '<p class="panel-note warn-txt">물음표(?) 표시된 담당자는 직원 목록에 없는 이름이라 미배정(또는 위에서 고른 직원)으로 들어갑니다.</p>' : ''}`;
      box.querySelector('#csv-go').onclick = async () => {
        const n = await commitCSV(rows, { skipDup: box.querySelector('#csv-skip').checked, owner: box.querySelector('#csv-owner').value });
        toast(`손님 ${n}명을 가져왔습니다`);
        box.innerHTML = `<p class="ok-txt" style="font-weight:700">✓ ${n}명을 가져왔습니다. 고객 화면에서 확인하고, 배정 파일을 직원에게 보내세요.</p>`;
      };
    } catch (e) { box.innerHTML = `<p class="danger-txt">${esc(e.message)}</p>`; }
  };
}

// ---------------- 직원 ----------------
async function renderStaff(el, ctx, s) {
  const mine = (await listCustomers()).filter((c) => !c.owner || c.owner === s.me?.id);
  const reportedToday = s.lastReportAt && s.lastReportAt.slice(0, 10) === today();
  el.innerHTML = `
    <div class="page-head"><button class="icon-btn back" id="back" aria-label="뒤로">${icon('left')}</button><h1>팀장 보고</h1></div>
    <div class="card">
      <h3>팀장에게 보고 파일 보내기</h3>
      <p style="color:var(--text-2);font-size:14px;margin:0 0 12px">내 손님 ${mine.length}명의 상담 기록·일정이 담긴 파일을 만듭니다. 공유 화면에서 <b>카카오톡 → 팀장님</b>을 고르세요.</p>
      <button class="btn btn-primary btn-block" id="report" style="min-height:56px">${icon('send')} 보고 파일 보내기</button>
      <div style="font-size:13px;margin-top:8px;color:${reportedToday ? 'var(--ok)' : 'var(--warn)'}">${s.lastReportAt ? `마지막 보고: ${relTime(s.lastReportAt)}` : '아직 보고한 적이 없습니다'}</div>
    </div>
    <div class="card">
      <h3>팀장 배정 파일 불러오기</h3>
      <p style="color:var(--text-2);font-size:14px;margin:0 0 12px">카톡으로 받은 <b>배정_${esc(s.me?.name || '이름')}_날짜.json</b> 파일을 저장한 뒤 불러오세요. 새로 배정된 손님이 추가되고, 다른 직원에게 넘어간 손님은 빠집니다.</p>
      <button class="btn btn-block" id="pick">${icon('upload')} 배정 파일 불러오기</button>
      <input type="file" id="file" accept=".json,application/json" class="hidden">
      <div style="font-size:13px;margin-top:8px;color:var(--text-2)">${s.lastAssignAt ? `마지막으로 받은 시각: ${relTime(s.lastAssignAt)}` : ''}</div>
    </div>
    <p class="panel-note">💡 순서: 팀장 파일을 받기 전에 먼저 보고 파일을 보내 두면, 내가 수정한 내용이 사라질 일이 없습니다.</p>`;

  el.querySelector('#back').onclick = () => (history.length > 1 ? history.back() : (location.hash = '#/home'));
  el.querySelector('#report').onclick = async () => {
    try { const n = await sendReportFile(); toast(`보고 파일을 만들었습니다 (손님 ${n}명)`); ctx.rerender(); } catch (e) { toast(e.message); }
  };
  const fi = el.querySelector('#file');
  el.querySelector('#pick').onclick = () => fi.click();
  fi.onchange = async () => {
    const f = fi.files[0]; fi.value = '';
    if (!f) return;
    try {
      const pkg = await readPackage(f);
      if (pkg.type !== 'assign') { toast('배정 파일이 아닙니다'); return; }
      if (s.me && pkg.staff.id !== s.me.id
        && !(await confirmSheet({ title: `${pkg.staff.name}님 파일입니다`, message: `지금 이 기기는 ${s.me.name}님으로 설정되어 있습니다. ${pkg.staff.name}님 기기로 바꿀까요?`, ok: '바꾸기', danger: true }))) return;
      const r = await importAssign(pkg);
      toast(`새 손님 ${r.added}명 · 갱신 ${r.updated}명${r.removed ? ` · 재배정으로 ${r.removed}명 빠짐` : ""}${r.calls ? ` · 콜 ${r.calls}건` : ""}`);
      await buildNav(true);
      ctx.rerender();
    } catch (e) { toast(e.message); }
  };
}

Object.assign(__exp, { render });
};

__defs['views/team'] = function (__exp) {
// 팀장 대시보드: 맨 위 숫자 4개(방문·입금·지연·이번 달 실적) → 오늘 시간표 + 확인 필요 → 이번 주 일정 → 직원별 현황(접힘)
const { getSettings } = __req('db');
const { listCustomers, liveSchedule, liveHistory, missingDocs, liveDocs, isPayKind, patchCustomer, toggleSchedule } = __req('store');
const { esc, today, addDays, ddayLabel, fmtShort, fmtMoney, relTime, uid } = __req('utils');
const { icon, go, toast, siteTabs, bindSiteTabs, gradeBadge, ownerChip, emptyState } = __req('ui');
const { staffName, sendAssignFile } = __req('team');

const store = (k, area = 'sessionStorage') => ({
  get: () => { try { return window[area].getItem(k) || ''; } catch (e) { return ''; } },
  set: (v) => { try { window[area].setItem(k, v); } catch (e) { /* 무시 */ } },
});
const ss = store('teamStaff');
const staffOpen = store('teamStaffOpen', 'localStorage');

async function render(el, ctx) {
  const s = await getSettings();
  const all = await listCustomers();
  const { html: tabs, filtered: bySite } = await siteTabs(all);
  let who = ss.get();
  if (who && who !== '-' && !s.staff.some((x) => x.id === who)) { who = ''; ss.set(''); }
  const list = who ? bySite.filter((c) => (who === '-' ? !c.owner : c.owner === who)) : bySite;
  const t = today(), tm = addDays(t, 1), wk = addDays(t, 7), month = t.slice(0, 7), mm = Number(month.slice(5));
  const owner = (c) => ownerChip(staffName(s, c.owner), !c.owner);
  const sum = (arr) => arr.reduce((n, { it }) => n + (Number(it.amount) || 0), 0);

  // ---- 집계 ----
  const items = [];
  list.forEach((c) => liveSchedule(c).forEach((it) => items.push({ c, it })));

  // 오늘 시간표: 방문 + 오늘 날짜 계약·입금 일정. 시간 없는 일정은 맨 위 '종일', 시간 미정 방문은 맨 아래
  const sortKey = (e) => e.time || (e.type === 'visit' ? '99' : '');
  const timeline = [
    ...items.filter(({ it }) => it.date === t).map(({ c, it }) => ({ type: evType(it), time: '', c, it, done: !!it.done })),
    ...list.filter((c) => c.visitDate === t).map((c) => ({ type: 'visit', time: c.visitTime || '', c, done: !!c.visitDone })),
  ].sort((a, b) => sortKey(a).localeCompare(sortKey(b)));
  const tomorrow = [
    ...list.filter((c) => c.visitDate === tm).map((c) => ({ type: 'visit', time: c.visitTime || '', c })),
    ...items.filter(({ it }) => it.date === tm && !it.done).map(({ c, it }) => ({ type: evType(it), time: '', c, it })),
  ].sort((a, b) => (a.time || '').localeCompare(b.time || ''));

  const visitsToday = timeline.filter((e) => e.type === 'visit');
  const visitsTomorrow = tomorrow.filter((e) => e.type === 'visit').length;
  const payToday = items.filter((x) => isPay(x) && x.it.date === t);
  const payTodayLeft = payToday.filter(({ it }) => !it.done);
  const late = items.filter(({ it }) => !it.done && it.date && it.date < t).sort((a, b) => a.it.date.localeCompare(b.it.date));
  const payLate = late.filter(isPay);
  const week = items.filter(({ it }) => !it.done && it.date > t && it.date <= wk).sort((a, b) => a.it.date.localeCompare(b.it.date));

  // 이번 달 실적
  const inMonth = (d) => (d || '').startsWith(month);
  const mContract = items.filter(({ it }) => it.kind === '계약서 작성' && it.done && inMonth(it.doneDate || it.date)).length;
  const mVisit = list.reduce((n, c) => n + liveHistory(c).filter((h) => h.kind === '방문' && inMonth(h.date)).length, 0);
  const mNew = list.filter((c) => inMonth(c.firstDate)).length;
  const mPaid = items.filter(({ it }) => isPayKind(it.kind) && it.done && inMonth(it.doneDate));

  const docRows = list.filter((c) => liveDocs(c).length && missingDocs(c).length).sort((a, b) => missingDocs(b).length - missingDocs(a).length);
  const careOver = list.filter((c) => c.nextDate && c.nextDate < t).sort((a, b) => a.nextDate.localeCompare(b.nextDate));
  const unassigned = bySite.filter((c) => !c.owner).length;
  const noReport = s.staff.filter((x) => !((s.staffSync[x.id] || {}).reportAt || '').startsWith(t));

  // ---- 조각 ----
  const TAG = { visit: '방문', pay: '입금', contract: '계약' };
  const action = (e) => {
    if (e.done) return `<span class="ok-txt">✓ ${e.type === 'visit' ? '방문함' : e.type === 'pay' ? '입금됨' : '완료'}</span>`;
    if (e.type === 'visit') return `<button class="btn btn-sm" data-visit="${e.c.id}">방문 확인</button>`;
    return `<button class="btn btn-sm btn-primary" data-sch="${e.c.id}|${e.it.id}">${e.type === 'pay' ? '입금 확인' : '완료'}</button>`;
  };
  const detail = (e) => (e.type === 'visit'
    ? [e.c.site, e.c.unitType && `${e.c.unitType} 관심`].filter(Boolean).join(' · ')
    : [e.it.kind, e.c.unit].filter(Boolean).join(' · '));
  const tlRow = (e) => `<div class="tl-row ${e.done ? 'done' : ''}" data-id="${e.c.id}">
      <span class="tl-time">${e.time ? esc(e.time) : e.type === 'visit' ? '미정' : '종일'}</span>
      <span class="ev-tag ${e.type}">${TAG[e.type]}</span>
      <span class="tl-main"><b>${esc(e.c.name)}</b> ${gradeBadge(e.c.grade)} <small>${esc(detail(e))}</small></span>
      <span class="tl-amt">${e.it?.amount ? esc(fmtMoney(e.it.amount)) : ''}</span>
      ${owner(e.c)}
      <span class="tl-act">${action(e)}</span></div>`;

  const lateRow = ({ c, it }) => `<div class="al-row danger" data-id="${c.id}">
      <span class="dd-txt over">${ddayLabel(it.date)}</span>
      <span class="al-main"><b>${esc(c.name)}</b> ${esc(it.kind)}${it.amount ? ` <b class="danger-txt">${esc(fmtMoney(it.amount))}</b>` : ''}</span>
      ${owner(c)}
      <button class="btn btn-sm" data-sch="${c.id}|${it.id}">${isPayKind(it.kind) ? '입금 확인' : '완료'}</button></div>`;

  const byOwner = (arr) => {
    const m = {};
    arr.forEach((c) => { const n = staffName(s, c.owner); m[n] = (m[n] || 0) + 1; });
    return Object.entries(m).map(([n, k]) => `${esc(n)} ${k}`).join(' · ');
  };
  const fold = (id, title, sub, body) => `<details class="al-fold" id="${id}">
      <summary class="al-row warn"><span class="al-main"><b>${title}</b> <small>${sub}</small></span><span class="chev">${icon('right', 'sm')}</span></summary>
      <div class="al-body">${body}</div></details>`;

  const alerts = [
    ...late.map(lateRow),
    noReport.length ? `<a class="al-row warn" href="#/sync"><span class="al-main"><b>오늘 보고 전</b> <small>${noReport.map((x) => esc(x.name)).join(' · ')}</small></span><span class="chev">${icon('right', 'sm')}</span></a>` : '',
    docRows.length ? fold('f-docs', `서류 미비 ${docRows.length}명`, byOwner(docRows),
      docRows.map((c) => `<a class="al-sub" href="#/c/${c.id}"><b>${esc(c.name)}</b>${owner(c)}<span class="tags">${missingDocs(c).map((d) => `<span class="tag">${esc(d.name)}</span>`).join('')}</span></a>`).join('')) : '',
    careOver.length ? fold('f-care', `관리 기한 지남 ${careOver.length}명`, byOwner(careOver),
      careOver.slice(0, 15).map((c) => `<a class="al-sub" href="#/c/${c.id}"><span class="dd-txt over">${ddayLabel(c.nextDate)}</span><b>${esc(c.name)}</b> ${gradeBadge(c.grade)}${owner(c)}</a>`).join('')
      + (careOver.length > 15 ? `<a class="more" href="#/customers">전체 ${careOver.length}명 보기</a>` : '')) : '',
    unassigned && who !== '-' ? `<button class="al-row warn" data-who="-"><span class="al-main"><b>담당 없는 손님 ${unassigned}명</b> <small>눌러서 보기</small></span><span class="chev">${icon('right', 'sm')}</span></button>` : '',
  ].filter(Boolean);

  const card = (label, num, sub, cls = '') => `<div class="kpi ${cls}"><span class="label">${label}</span><span class="num">${num}</span><span class="sub">${sub}</span></div>`;
  const vDone = visitsToday.filter((e) => e.done).length;
  const isOpen = staffOpen.get() === '1';

  el.innerHTML = `
    <div class="page-head"><h1>팀 현황 <span class="h-date">${fmtShort(t)}</span></h1>
      ${s.staff.length ? `<select class="who-select" id="who" aria-label="직원 선택">
        <option value="">전체 직원</option>${s.staff.map((x) => `<option value="${x.id}" ${who === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}
        ${unassigned ? `<option value="-" ${who === '-' ? 'selected' : ''}>미배정 (${unassigned})</option>` : ''}</select>` : ''}
      <a class="btn btn-sm" href="#/sync">${icon('swap', 'sm')} 파일 주고받기</a></div>
    ${tabs}
    ${!s.staff.length ? `<a class="card notice" href="#/settings">${icon('users', 'sm')} 설정에서 직원을 등록하면 손님을 배정하고 직원별 현황을 볼 수 있습니다</a>` : ''}

    <div class="kpis four">
      ${card('오늘 방문', `${visitsToday.length}<small>명</small>`, visitsToday.length ? `방문 확인 ${vDone} · 내일 ${visitsTomorrow}명` : `내일 ${visitsTomorrow}명`, visitsToday.length ? 'hl' : '')}
      ${card('오늘 입금', payToday.length ? esc(fmtMoney(sum(payToday))) : '없음', payToday.length ? `${payToday.length}건 · ${payTodayLeft.length ? `미확인 ${payTodayLeft.length}건` : '모두 확인'}` : '오늘 예정된 입금 없음', payTodayLeft.length ? 'ok' : '')}
      ${card('입금 지연', payLate.length ? esc(fmtMoney(sum(payLate))) : '없음', payLate.length ? `${payLate.length}건 · 확인 필요` : '늦어진 입금 없음', payLate.length ? 'danger' : '')}
      ${card(`${mm}월 실적`, `계약 ${mContract}<small>건</small>`, `방문 ${mVisit} · 신규 ${mNew} · 입금 ${fmtMoney(sum(mPaid)) || '0원'}`)}
    </div>

    <div class="dash-main">
      <section class="panel" id="p-today">
        <div class="panel-head">${icon('clock', 'sm')} 오늘 시간표 <span class="cnt">${timeline.length}</span></div>
        ${timeline.length ? `<div class="tl">${timeline.map(tlRow).join('')}</div>` : '<div class="panel-empty">오늘 잡힌 방문·입금·계약 일정이 없습니다</div>'}
        ${tomorrow.length ? `<div class="tl-next"><b>내일 ${fmtShort(tm)}</b>${tomorrow.map((e) => `<a href="#/c/${e.c.id}">${e.time ? `<span class="time">${esc(e.time)}</span> ` : ''}${esc(e.c.name)} <small>${e.type === 'visit' ? '방문' : esc(e.it.kind)} · ${esc(staffName(s, e.c.owner))}</small></a>`).join('')}</div>` : ''}
      </section>

      <div class="dash-side">
        <section class="panel ${late.length ? 'alert' : ''}" id="p-alert">
          <div class="panel-head">${icon('alert', 'sm')} 확인 필요 <span class="cnt">${alerts.length}</span></div>
          ${alerts.length ? `<div class="al">${alerts.join('')}</div>` : '<div class="panel-empty">밀린 일이 없습니다 👍</div>'}
        </section>

        <section class="panel" id="p-week">
          <div class="panel-head">${icon('won', 'sm')} 이번 주 계약·입금 <span class="cnt">${week.length}</span>
            ${week.some(isPay) ? `<span class="hint">입금 예정 ${esc(fmtMoney(sum(week.filter(isPay))))}</span>` : ''}</div>
          ${week.length ? `<div class="wk">${week.map(({ c, it }) => `<div class="wk-row" data-id="${c.id}">
              <span class="wk-d"><b>${fmtShort(it.date)}</b><small>${ddayLabel(it.date)}</small></span>
              <span class="al-main"><b>${esc(c.name)}</b> <span class="kind ${isPayKind(it.kind) ? 'pay' : ''}">${esc(it.kind)}</span></span>
              <span class="tl-amt">${esc(fmtMoney(it.amount))}</span>${owner(c)}</div>`).join('')}</div>`
          : '<div class="panel-empty">7일 안에 예정된 일정이 없습니다</div>'}
        </section>
      </div>
    </div>

    ${s.staff.length ? `<details class="panel staff-fold" id="p-staff" ${isOpen ? 'open' : ''}>
      <summary class="panel-head">${icon('users', 'sm')} 직원별 현황 <span class="hint">${noReport.length ? `<span class="danger-txt">보고 전 ${noReport.length}명</span> · ` : ''}<span class="fold-lbl">${isOpen ? '접기' : '펼치기'}</span></span></summary>
      ${table(['직원', '담당', `${mm}월 계약`, '오늘 방문', '입금 지연', '기한 지남', '서류 미비', '최근 보고', ''],
        [...s.staff.map((st) => staffRow(st, bySite.filter((c) => c.owner === st.id), s, t, month)),
          unassigned ? staffRow({ id: '-', name: '미배정' }, bySite.filter((c) => !c.owner), s, t, month) : ''])}
    </details>` : ''}
    ${!all.length ? emptyState('📋', '손님을 등록해 보세요', '+ 버튼으로 한 명씩 등록하거나, 파일 주고받기에서 엑셀(CSV) 명단을 한꺼번에 가져올 수 있습니다. 설정에서 샘플 데이터로 미리 볼 수도 있습니다.') : ''}`;

  // ---- 이벤트 ----
  bindSiteTabs(el, ctx.rerender);
  el.querySelector('#who')?.addEventListener('change', (e) => { ss.set(e.target.value); ctx.rerender(); });
  el.querySelectorAll('[data-who]').forEach((b) => { b.onclick = () => { ss.set(b.dataset.who); ctx.rerender(); }; });
  el.querySelectorAll('[data-id]').forEach((r) => {
    r.onclick = (e) => { if (!e.target.closest('button,a')) go(`#/c/${r.dataset.id}`); };
  });
  const sf = el.querySelector('#p-staff');
  sf?.addEventListener('toggle', () => {
    staffOpen.set(sf.open ? '1' : '0');
    const l = sf.querySelector('.fold-lbl');
    if (l) l.textContent = sf.open ? '접기' : '펼치기';
  });
  el.querySelectorAll('[data-visit]').forEach((b) => {
    b.onclick = async () => {
      await patchCustomer(b.dataset.visit, (c) => {
        c.visitDone = true; c.lastContact = t;
        c.history = [{ id: uid(), date: t, kind: '방문', text: '견본주택 방문 (팀장 확인)' }, ...(c.history || [])];
      });
      toast('방문 확인했습니다'); ctx.rerender();
    };
  });
  el.querySelectorAll('[data-sch]').forEach((b) => {
    b.onclick = async () => {
      const [cid, sid] = b.dataset.sch.split('|');
      await toggleSchedule(cid, sid, true);
      toast(`${b.textContent} 처리했습니다 · 다음 배정 파일에 반영됩니다`); ctx.rerender();
    };
  });
  el.querySelectorAll('[data-assign]').forEach((b) => {
    b.onclick = async () => {
      const n = await sendAssignFile(b.dataset.assign);
      toast(`배정 파일을 만들었습니다 (손님 ${n}명) · 카톡으로 보내주세요`); ctx.rerender();
    };
  });
  el.querySelectorAll('[data-staff]').forEach((b) => { b.onclick = () => { ss.set(b.dataset.staff); ctx.rerender(); window.scrollTo(0, 0); }; });
}

function table(head, rows) {
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr>${head.map((h) => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
}

function staffRow(st, mine, s, t, month) {
  const sch = [];
  mine.forEach((c) => liveSchedule(c).forEach((it) => sch.push(it)));
  const late = sch.filter((it) => !it.done && isPayKind(it.kind) && it.date && it.date < t).length;
  const contracts = sch.filter((it) => it.kind === '계약서 작성' && it.done && (it.doneDate || it.date || '').startsWith(month)).length;
  const over = mine.filter((c) => c.nextDate && c.nextDate < t).length;
  const sync = s.staffSync[st.id] || {};
  const reportOk = (sync.reportAt || '').startsWith(t);
  const n = (v, cls) => (v ? `<span class="${cls}">${v}</span>` : '<span class="zero">0</span>');
  return `<tr>
    <td><button class="link" data-staff="${st.id}"><b>${esc(st.name)}</b></button></td>
    <td class="num">${mine.length}</td>
    <td class="num">${n(contracts, 'accent-txt')}</td>
    <td class="num">${n(mine.filter((c) => c.visitDate === t).length, 'accent-txt')}</td>
    <td class="num">${n(late, 'danger-txt')}</td>
    <td class="num">${n(over, 'warn-txt')}</td>
    <td class="num">${n(mine.filter((c) => liveDocs(c).length && missingDocs(c).length).length, 'warn-txt')}</td>
    <td>${st.id === '-' ? '' : sync.reportAt ? `<span class="${reportOk ? 'ok-txt' : 'danger-txt'}">${relTime(sync.reportAt)}</span>` : '<span class="danger-txt">받은 적 없음</span>'}</td>
    <td>${st.id === '-' ? '<a class="btn btn-sm" href="#/customers">배정하기</a>' : `<button class="btn btn-sm" data-assign="${st.id}">${icon('download', 'sm')} 배정 파일</button>`}</td>
  </tr>`;
}

Object.assign(__exp, { render });
};


__req('app');
})();
</script>
</body>
</html>
