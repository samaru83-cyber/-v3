/* ===== 테마 변수 ===== */
:root {
  --accent: #2563eb;
  --accent-press: #1d4ed8;
  --accent-soft: #e8efff;
  --on-accent: #fff;
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #f0f2f5;
  --text: #16181d;
  --text-2: #5b6170;
  --text-3: #9298a5;
  --line: #e4e7ec;
  --danger: #dc2626; --danger-soft: #fde8e8;
  --warn: #ea7a0c;   --warn-soft: #fff0df;
  --soon: #b88a00;   --soon-soft: #fff7d1;
  --ok: #16a34a;     --ok-soft: #e3f6e9;
  --muted-soft: #eef0f3;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --shadow-lg: 0 -8px 30px rgba(16,24,40,.16);
  --radius: 14px;
  --tabbar-h: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --accent: #5b8def; --accent-press: #7aa3f3; --accent-soft: #1c2a45; --on-accent: #0b1220;
    --bg: #0f1115; --surface: #181b21; --surface-2: #22262e;
    --text: #eceef2; --text-2: #a4aab6; --text-3: #6f7683; --line: #2b3039;
    --danger: #f87171; --danger-soft: #3a1c1f; --warn: #fb9a3c; --warn-soft: #3a2614;
    --soon: #e8c44a; --soon-soft: #352d10; --ok: #4ade80; --ok-soft: #14301f; --muted-soft: #262a32;
    --shadow: none; --shadow-lg: 0 -8px 30px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --accent: #5b8def; --accent-press: #7aa3f3; --accent-soft: #1c2a45; --on-accent: #0b1220;
  --bg: #0f1115; --surface: #181b21; --surface-2: #22262e;
  --text: #eceef2; --text-2: #a4aab6; --text-3: #6f7683; --line: #2b3039;
  --danger: #f87171; --danger-soft: #3a1c1f; --warn: #fb9a3c; --warn-soft: #3a2614;
  --soon: #e8c44a; --soon-soft: #352d10; --ok: #4ade80; --ok-soft: #14301f; --muted-soft: #262a32;
  --shadow: none; --shadow-lg: 0 -8px 30px rgba(0,0,0,.5);
  color-scheme: dark;
}

/* ===== 기본 ===== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "Noto Sans KR", sans-serif;
  background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
.icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.icon.sm { width: 18px; height: 18px; }
.hidden { display: none !important; }

#app { max-width: 480px; margin: 0 auto; min-height: 100%; background: var(--bg); position: relative; }
#view { padding: calc(12px + var(--safe-t)) 16px calc(var(--tabbar-h) + 96px + var(--safe-b)); }

/* ===== 상단 ===== */
.page-head { display: flex; align-items: center; gap: 8px; min-height: 44px; margin-bottom: 10px; }
.page-head h1 { font-size: 22px; font-weight: 700; margin: 0; flex: 1; letter-spacing: -0.3px; }
.page-head .sub { font-size: 13px; color: var(--text-2); font-weight: 500; }
.back { margin-left: -8px; }

.site-tabs { display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px 12px; padding: 2px 16px; scrollbar-width: none; }
.site-tabs::-webkit-scrollbar { display: none; }
.site-tabs button {
  flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 8px 14px; font-size: 14px; font-weight: 600; color: var(--text-2);
}
.site-tabs button.on { background: var(--text); color: var(--bg); border-color: var(--text); }

/* ===== 버튼 ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 48px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); font-weight: 600; font-size: 15px; cursor: pointer; color: var(--text);
}
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn-primary:active { background: var(--accent-press); }
.btn-soft { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.btn-danger { color: var(--danger); }
.btn-block { width: 100%; }
.btn-sm { min-height: 38px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent;
  display: inline-flex; align-items: center; justify-content: center; color: var(--text); cursor: pointer;
}
.icon-btn:active { background: var(--surface-2); }
.btn-row { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }

/* ===== 배너·요약 ===== */
.banner {
  display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: var(--radius);
  background: var(--accent); color: var(--on-accent); font-weight: 600; margin-bottom: 12px;
}
.banner .icon { width: 22px; height: 22px; }
.banner b { font-size: 18px; }
.banner .x { margin-left: auto; background: none; border: 0; color: inherit; opacity: .8; padding: 4px; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
.stat {
  background: var(--surface); border-radius: var(--radius); padding: 10px 6px 12px; text-align: center;
  box-shadow: var(--shadow); border: 1px solid var(--line); cursor: pointer;
}
.stat .label { font-size: 12px; color: var(--text-2); font-weight: 600; }
.stat .num { font-size: 26px; font-weight: 800; line-height: 1.2; letter-spacing: -0.5px; }
.stat.over .num { color: var(--danger); }
.stat.today .num { color: var(--warn); }

/* ===== 섹션 ===== */
.section { margin-bottom: 18px; }
.section-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; margin: 0 2px 8px; }
.section-title .dot { width: 10px; height: 10px; border-radius: 50%; }
.section-title .cnt { color: var(--text-3); font-weight: 600; }
.dot.over { background: var(--danger); } .dot.today { background: var(--warn); }
.dot.soon { background: #f5c400; } .dot.later { background: var(--text-3); }
.dot.none { background: transparent; border: 2px solid var(--text-3); }
.more { display: block; width: 100%; background: none; border: 0; color: var(--accent); font-weight: 600; padding: 10px; }

/* ===== 고객 카드 ===== */
.ccard-wrap { position: relative; margin-bottom: 8px; border-radius: var(--radius); overflow: hidden; }
.ccard-wrap .swipe-bg {
  position: absolute; inset: 0; background: var(--ok); color: #fff; display: flex; align-items: center;
  padding-left: 20px; font-weight: 700; gap: 6px; border-radius: var(--radius); opacity: 0;
}
.ccard-wrap.swiping .swipe-bg { opacity: 1; }
.ccard {
  position: relative; display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); touch-action: pan-y;
  transition: transform .2s ease; cursor: pointer; user-select: none;
}
.ccard.dragging { transition: none; }
.ccard .body { flex: 1; min-width: 0; }
.ccard .name { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.ccard .meta { font-size: 13px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ccard .memo { font-size: 13px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.ccard .done-btn {
  width: 48px; height: 48px; border-radius: 12px; border: 0; background: var(--accent-soft); color: var(--accent);
  display: flex; align-items: center; justify-content: center; flex: none; cursor: pointer;
}
.ccard .call-btn { width: 44px; height: 48px; border-radius: 12px; border: 0; background: var(--surface-2); color: var(--text); display: flex; align-items: center; justify-content: center; flex: none; }

.dday {
  flex: none; min-width: 64px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 17px; letter-spacing: -0.3px; padding: 0 6px;
}
.dday.overdue { background: var(--danger); color: #fff; }
.dday.today { background: var(--warn); color: #fff; }
.dday.soon { background: var(--soon-soft); color: var(--soon); }
.dday.later { background: var(--muted-soft); color: var(--text-2); }
.dday.none { background: var(--muted-soft); color: var(--text-3); font-size: 13px; }
.dday.small { min-width: 52px; height: 30px; font-size: 13px; border-radius: 8px; }

.badge { display: inline-flex; align-items: center; height: 22px; padding: 0 7px; border-radius: 6px; font-size: 12px; font-weight: 700; }
.g-s { background: #fde2e2; color: #b42318; }
.g-a { background: #ffead5; color: #b54708; }
.g-b { background: #e0eaff; color: #2d4fbf; }
.g-c { background: var(--muted-soft); color: var(--text-2); }
.g-done { background: #dcfae6; color: #067647; }
.g-hold { background: #f2f4f7; color: #667085; }
:root[data-theme="dark"] .g-s, :root[data-theme="dark"] .g-a, :root[data-theme="dark"] .g-b, :root[data-theme="dark"] .g-done, :root[data-theme="dark"] .g-hold { filter: brightness(.85) saturate(1.2); }
.tag { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); font-size: 12px; font-weight: 600; margin: 0 4px 4px 0; }

/* ===== 목록 ===== */
.search { position: relative; margin-bottom: 10px; }
.search input { width: 100%; height: 50px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); padding: 0 14px 0 44px; font-size: 16px; }
.search .icon { position: absolute; left: 14px; top: 14px; color: var(--text-3); }
.filters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
.filters select { height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 8px; font-size: 14px; font-weight: 600; }
.list-count { font-size: 13px; color: var(--text-2); margin: 0 2px 8px; }
.row {
  display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); margin-bottom: 8px; cursor: pointer;
}
.row .body { flex: 1; min-width: 0; }
.row .name { font-weight: 700; font-size: 16px; display: flex; gap: 6px; align-items: center; }
.row .meta { font-size: 13px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.empty { text-align: center; color: var(--text-2); padding: 40px 16px; }
.empty .big { font-size: 40px; margin-bottom: 6px; }
.empty p { margin: 4px 0 16px; }

/* ===== 카드/폼 ===== */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
.card h3 { font-size: 15px; margin: 0 0 10px; }
.field { margin-bottom: 14px; }
.field > label { display: block; font-size: 13px; font-weight: 700; color: var(--text-2); margin-bottom: 6px; }
.field .req { color: var(--danger); }
.input, .field input:not([type=checkbox]):not([type=radio]), .field select, .field textarea {
  width: 100%; min-height: 50px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
  padding: 0 14px; font-size: 16px;
}
.field textarea { padding: 12px 14px; min-height: 96px; resize: vertical; line-height: 1.5; }
.field input:focus, .field select:focus, .field textarea:focus, .search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.field .hint { font-size: 13px; color: var(--text-3); margin-top: 4px; }
.field .warn { font-size: 13px; color: var(--danger); margin-top: 6px; font-weight: 600; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button {
  flex: 1 1 0; min-width: 0; min-height: 46px; padding: 0 4px; border-radius: 12px; border: 1px solid var(--line); white-space: nowrap;
  background: var(--surface); font-weight: 700; font-size: 15px; color: var(--text-2); cursor: pointer;
}
.seg button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

.quick-dates { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.quick-dates button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--text-2); }

/* ===== 고객 상세 ===== */
.profile { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; flex: none; }
.profile .nm { font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.profile .ph { font-size: 15px; color: var(--text-2); }
.actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
.actions .btn { flex-direction: column; min-height: 68px; gap: 4px; font-size: 13px; padding: 0 4px; }
.info { display: grid; grid-template-columns: 96px 1fr; row-gap: 10px; font-size: 15px; }
.info dt { color: var(--text-2); font-size: 14px; }
.info dd { margin: 0; font-weight: 600; word-break: keep-all; }
.next-box { display: flex; align-items: center; gap: 12px; }
.next-box .dday { min-width: 76px; height: 56px; font-size: 20px; }
.next-box .when { font-weight: 700; font-size: 16px; }
.next-box .sub { font-size: 13px; color: var(--text-2); }

.hist { list-style: none; margin: 0; padding: 0; }
.hist li { display: grid; grid-template-columns: 70px 1fr auto; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.hist li:first-child { border-top: 0; }
.hist .d { color: var(--text-2); font-size: 13px; }
.hist .k { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 5px; background: var(--surface-2); color: var(--text-2); margin-right: 4px; }
.hist .k.문자 { background: var(--accent-soft); color: var(--accent); }
.hist .k.관리완료 { background: var(--ok-soft); color: var(--ok); }
.hist .t { white-space: pre-wrap; word-break: break-word; }
.hist .rm { background: none; border: 0; color: var(--text-3); padding: 0 4px; font-size: 18px; }

/* ===== 하단 탭바·FAB ===== */
.tabbar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; z-index: 20;
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; height: calc(var(--tabbar-h) + var(--safe-b)); padding-bottom: var(--safe-b);
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
}
.tabbar a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--text-3); font-size: 11px; font-weight: 600; position: relative; }
.tabbar a.on { color: var(--accent); }
.tabbar .icon { width: 24px; height: 24px; }
.tabbar .nb { position: absolute; top: 6px; left: calc(50% + 6px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 5px; }
.fab {
  position: fixed; z-index: 21; right: max(16px, calc(50% - 240px + 16px)); bottom: calc(var(--tabbar-h) + 16px + var(--safe-b));
  width: 62px; height: 62px; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-accent);
  box-shadow: 0 6px 16px rgba(37,99,235,.35); display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.fab .icon { width: 30px; height: 30px; stroke-width: 2.4; }
.fab:active { transform: scale(.95); }

/* ===== 바텀시트 ===== */
.sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 40; opacity: 0; transition: opacity .2s; }
.sheet-backdrop.show { opacity: 1; }
.sheet {
  position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 100%); width: 100%; max-width: 480px; z-index: 41;
  background: var(--surface); border-radius: 20px 20px 0 0; box-shadow: var(--shadow-lg);
  padding: 8px 16px calc(16px + var(--safe-b)); max-height: 90vh; overflow-y: auto; transition: transform .25s ease;
}
.sheet.show { transform: translate(-50%, 0); }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 12px; }
.sheet h2 { font-size: 19px; margin: 0 0 4px; }
.sheet .sheet-sub { color: var(--text-2); font-size: 14px; margin: 0 0 14px; }
.choice-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.choice-grid .btn { min-height: 56px; font-size: 16px; }
.choice-grid .btn small { font-weight: 500; color: inherit; opacity: .8; font-size: 12px; }

/* ===== 토스트 ===== */
.toast {
  position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + 20px + var(--safe-b)); transform: translateX(-50%) translateY(20px);
  background: #1f2329; color: #fff; padding: 12px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; z-index: 60;
  display: flex; align-items: center; gap: 12px; opacity: 0; pointer-events: none; transition: all .2s;
  width: max-content; max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
.toast button { background: none; border: 0; color: #8fb3ff; font-weight: 700; padding: 0; white-space: nowrap; }

/* ===== 문자 ===== */
.chips { display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px 10px; padding: 2px 16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; margin: 0 0 10px; padding: 0; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 12px; font-size: 14px; font-weight: 600; color: var(--text-2); cursor: pointer; }
.chip.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.var-chip { font-size: 13px; padding: 6px 10px; background: var(--surface-2); border: 0; }
.preview { width: 100%; min-height: 220px; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface-2); font-size: 15px; line-height: 1.6; resize: vertical; }
.preview .miss { background: var(--warn-soft); color: var(--warn); }
.tpl { display: flex; gap: 10px; align-items: flex-start; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 8px; }
.tpl .body { flex: 1; min-width: 0; cursor: pointer; }
.tpl .cat { font-size: 12px; color: var(--accent); font-weight: 700; }
.tpl .ttl { font-weight: 700; }
.tpl .snip { font-size: 13px; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.star { background: none; border: 0; padding: 4px; color: var(--text-3); cursor: pointer; }
.star.on { color: #f5b400; }
.star.on .icon { fill: currentColor; }
.miss-note { font-size: 13px; color: var(--warn); margin: 6px 0 0; }

/* ===== 캘린더 ===== */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.cal-head .title { font-size: 19px; font-weight: 800; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; margin-bottom: 14px; }
.cal .wd { text-align: center; font-size: 12px; font-weight: 700; color: var(--text-3); padding: 4px 0; }
.cal .wd.sun, .cal .day.sun .n { color: var(--danger); }
.cal .wd.sat, .cal .day.sat .n { color: var(--accent); }
.cal .day { aspect-ratio: 1 / 1.15; border-radius: 10px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 6px; gap: 3px; cursor: pointer; min-width: 0; }
.cal .day .n { font-size: 15px; font-weight: 600; }
.cal .day .c { font-size: 11px; font-weight: 800; min-width: 20px; height: 20px; border-radius: 10px; padding: 0 5px; display: flex; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent); }
.cal .day .c.over { background: var(--danger-soft); color: var(--danger); }
.cal .day.out { opacity: .35; }
.cal .day.today .n { background: var(--accent); color: var(--on-accent) !important; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; margin-top: -3px; }
.cal .day.sel { background: var(--surface-2); outline: 2px solid var(--accent); }

/* ===== 설정 ===== */
.set-row { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.set-row:first-of-type { border-top: 0; }
.set-row .lbl { flex: 1; font-weight: 600; }
.set-row .lbl small { display: block; color: var(--text-2); font-weight: 400; font-size: 13px; }
.cycle-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.cycle-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; color: var(--text-2); }
.cycle-grid input { height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); text-align: center; font-size: 17px; font-weight: 700; }
.site-item { display: grid; grid-template-columns: 1fr auto; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
.site-item:first-child { border-top: 0; }
.site-item input { height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; font-size: 15px; width: 100%; }
.site-item .addr { grid-column: 1 / -1; }
.privacy { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius); background: var(--ok-soft); color: var(--ok); font-size: 14px; font-weight: 600; margin-bottom: 12px; }
.ver { text-align: center; color: var(--text-3); font-size: 12px; margin-top: 16px; }

/* ======================================================================
   팀 기능 · PC 화면 (app.css 다음에 로드)
   ====================================================================== */
:root { --purple: #7c3aed; --purple-soft: #f1eafe; }
:root[data-theme="dark"] { --purple: #a78bfa; --purple-soft: #2a2140; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --purple: #a78bfa; --purple-soft: #2a2140; } }

.brand, .desk-only, .lbl-full, .tabbar a.desk-only { display: none; }
.tabbar a .lbl-short { display: block; }
body.no-nav .tabbar, body.no-nav .fab { display: none !important; }
.ok-txt { color: var(--ok); font-weight: 700; }
.danger-txt { color: var(--danger); font-weight: 700; }
.warn-txt { color: var(--warn); font-weight: 700; }
.accent-txt { color: var(--accent); font-weight: 700; }
.zero { color: var(--text-3); }
.muted-p { color: var(--text-3); font-size: 13px; margin: 0 0 10px; }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font: inherit; }
td > div > .owner:first-child { margin-left: 0; margin-top: 3px; }
.owner { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 700; background: var(--purple-soft); color: var(--purple); margin-left: 4px; white-space: nowrap; }
.owner.none { background: var(--warn-soft); color: var(--warn); }
.notice { display: flex; gap: 10px; align-items: center; color: var(--warn); background: var(--warn-soft); border-color: transparent; font-weight: 600; font-size: 14px; cursor: pointer; }
.page-head .btn-sm { flex: none; }
.input { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; min-height: 46px; padding: 0 12px; font-size: 15px; width: 100%; }
.input.sm-in { min-height: 38px; height: 38px; padding: 0 10px; font-size: 14px; border-radius: 8px; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }
.kpi { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; padding: 12px 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); cursor: pointer; box-shadow: var(--shadow); color: var(--text); }
.kpi .label { font-size: 13px; font-weight: 700; color: var(--text-2); }
.kpi .num { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.15; }
.kpi .sub { font-size: 12px; color: var(--text-3); font-weight: 600; }
.kpi.hl { border-color: var(--accent); } .kpi.hl .num { color: var(--accent); }
.kpi.warn .num { color: var(--warn); }
.kpi.danger { border-color: var(--danger); } .kpi.danger .num { color: var(--danger); }

/* 패널 · 표 */
.dash-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; min-width: 0; scroll-margin-top: 16px; }
.panel-head { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 16px; margin-bottom: 10px; }
.panel-head .cnt { color: var(--text-3); font-weight: 700; }
.panel-head .hint { margin-left: auto; font-size: 12px; color: var(--text-3); font-weight: 600; }
.panel-empty { color: var(--text-3); font-size: 14px; padding: 10px 2px; }
.panel-sub { font-size: 13px; font-weight: 700; color: var(--text-2); margin: 12px 0 6px; }
.panel-note { font-size: 13px; color: var(--text-2); margin: 10px 0 0; line-height: 1.6; }
.mini-list { display: flex; flex-wrap: wrap; gap: 6px; }
.mini-list a { display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 10px; background: var(--surface-2); color: var(--text); font-size: 13px; font-weight: 600; }
.mini-list .time { color: var(--accent); font-weight: 800; }
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 12px; color: var(--text-3); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; background: var(--surface); }
.tbl td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tr[data-id] { cursor: pointer; }
.tbl tbody tr:hover td { background: var(--surface-2); }
.tbl tr.muted td { opacity: .5; }
.tbl tr.late td { background: var(--danger-soft); }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; }
.sm { font-size: 12px; color: var(--text-2); }
.icon.sm { font-size: inherit; color: inherit; }
.tbl .time { font-weight: 800; color: var(--accent); font-size: 15px; }
.tbl .ellipsis { max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
.tbl input[type=checkbox] { width: 18px; height: 18px; }
.dd-txt { font-weight: 800; font-size: 13px; color: var(--text-2); white-space: nowrap; }
.dd-txt.over { color: var(--danger); } .dd-txt.today { color: var(--warn); }
.kind { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: var(--purple-soft); color: var(--purple); }
.kind.pay { background: var(--ok-soft); color: var(--ok); }

/* 홈 일정(직원) */
.agenda .section { margin-bottom: 14px; }
.ag-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 6px; color: var(--text); cursor: pointer; }
.ag-row.muted { opacity: .55; }
.ag-time { flex: none; min-width: 64px; display: flex; flex-direction: column; align-items: center; font-size: 11px; font-weight: 700; color: var(--text-2); background: var(--surface-2); border-radius: 10px; padding: 5px 6px; }
.ag-time b { font-size: 15px; color: var(--text); }
.ag-time.today { background: var(--warn-soft); color: var(--warn); } .ag-time.today b { color: var(--warn); }
.ag-time.over { background: var(--danger-soft); color: var(--danger); } .ag-time.over b { color: var(--danger); }
.ag-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ag-body b { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ag-body small { font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.warn-banner { background: var(--warn-soft); color: var(--warn); }
.warn-banner .btn { margin-left: auto; flex: none; }
.warn-banner small { font-weight: 500; }

/* 파일 주고받기 */
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; font-size: 13px; color: var(--text-2); font-weight: 600; }
.flow div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; display: flex; gap: 6px; align-items: center; }
.flow b { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; flex: none; }
.flow > span { color: var(--text-3); }
.drop { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 26px 12px; border: 2px dashed var(--line); border-radius: var(--radius); text-align: center; cursor: pointer; color: var(--text-2); background: var(--surface-2); transition: all .15s; }
.drop .icon { width: 30px; height: 30px; color: var(--accent); }
.drop span { font-size: 13px; color: var(--text-3); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.result { margin: 10px 0 0; padding-left: 18px; font-size: 14px; line-height: 1.8; }
.csv-opts { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-top: 12px; font-size: 14px; font-weight: 600; }
.csv-opts select { height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); padding: 0 8px; margin-left: 4px; }

      if (!db.objectStoreNames.contains('calls')) db.createObjectStore('calls', { keyPath: 'id' });

    req.onblocked = () => { /* 다른 탭이 옛 버전을 열고 있음: 그 탭이 닫히면 진행 */ };
    req.onsuccess = () => {
      const d = req.result;
      d.onversionchange = () => { d.close(); location.reload(); }; // 새 버전이 열리면 옛 탭은 닫고 새로고침
      resolve(d);
    };
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

async function run(store, mode, fn) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const t = db.transaction(store, mode);
    const s = t.objectStore(store);
    let out;
    const r = fn(s);
    if (r && 'onsuccess' in r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => resolve(out);
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error);
  });
}

/** 직원 모드에서는 내 손님만, 팀장/혼자 모드는 전체 */
function visibleCustomers(list, s) {
  if (isStaff(s) && s.me) return list.filter((c) => !c.owner || c.owner === s.me.id);
  return list;
}

// ---- 합치기 ----
const newerOf = (a, b, key) => ((b?.[key] || '') > (a?.[key] || '') ? b : a);

function mergeById(a = [], b = [], key, stamp) {
  const m = new Map();
  [...a, ...b].forEach((x) => {
    const k = x[key];
    const cur = m.get(k);
    if (!cur) m.set(k, x);
    else if (stamp) m.set(k, newerOf(cur, x, stamp));
    else m.set(k, { ...cur, ...x, deleted: !!(cur.deleted || x.deleted) }); // 히스토리: 한쪽이라도 삭제면 삭제
  });

 * owner(담당 직원)는 팀장 쪽 값이 우선.
 */
function mergeCustomer(local, incoming, ownerFromIncoming) {
  if (!local) return { ...incoming };
  const base = newerOf(local, incoming, 'updatedAt');
  const merged = {
    ...base,
    history: mergeById(local.history, incoming.history, 'id').sort((x, y) => (x.date < y.date ? 1 : x.date > y.date ? -1 : 0)),
    schedule: mergeById(local.schedule, incoming.schedule, 'id', 'updatedAt'),
    docs: mergeById(local.docs, incoming.docs, 'name', 't'),
    owner: ownerFromIncoming ? incoming.owner : local.owner,
    updatedAt: [local.updatedAt || '', incoming.updatedAt || ''].sort().pop(),

// ---- 파일 저장 (iPhone/안드로이드: 공유 시트 → 카톡 등, PC: 다운로드) ----
async function saveFile(name, text, type) {
  const blob = new Blob([text], { type: `${type};charset=utf-8` });
  const mobile = isIOS() || /Android/i.test(navigator.userAgent);
  if (mobile && navigator.canShare) {
    const file = new File([blob], name, { type });
    if (navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: name }); return true; } catch (e) { if (e.name === 'AbortError') return false; }
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  return true;
}

async function buildAssignPackage(staffId) {

  const customers = (await listCustomers()).filter((c) => c.owner === staffId);
  return {
    app: 'bunyang-crm', type: 'assign', version: 2, exportedAt: nowISO(),
    leadName: s.agentName, staff: { id: st.id, name: st.name },
    customers, templates: await listTemplates(),
    calls: (await listCalls()).filter((c) => c.owner === staffId),

}

async function sendAssignFile(staffId) {
  const pkg = await buildAssignPackage(staffId);
  const ok = await saveFile(`배정_${pkg.staff.name}_${stamp()}.json`, JSON.stringify(pkg), 'application/json');
  if (ok) {

// ---- 직원 → 팀장: 보고 파일 ----
async function sendReportFile() {

    .map((c) => ({ ...c, owner: s.me.id }));

    .filter((c) => !c.owner || c.owner === s.me.id)
    .map((c) => ({ ...c, owner: s.me.id }));

/** 파일 읽기 → 종류 판별 */
async function readPackage(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { throw new Error(`${file.name}: 파일을 읽을 수 없습니다`); }
  if (data.app !== 'bunyang-crm' || !Array.isArray(data.customers)) throw new Error(`${file.name}: 이 앱의 파일이 아닙니다`);
  return data;
}

async function importAssign(pkg) {
  const s = await getSettings();
  const local = await listCustomers();
  const byId = new Map(local.map((c) => [c.id, c]));
  const incomingIds = new Set(pkg.customers.map((c) => c.id));
  let added = 0, updated = 0, removed = 0;
  const out = pkg.customers.map((c) => {
    const cur = byId.get(c.id);
    if (cur) updated++; else added++;
    return { ...mergeCustomer(cur, c, true), synced: true };
  });
  await db.putMany('customers', out);
  // 팀장 쪽에서 빠진 손님(재배정·삭제) 정리: 예전에 받은 손님(synced)만 지운다. 직원이 새로 등록한 손님은 유지.
  for (const c of local) {
    if (c.synced && !incomingIds.has(c.id)) { await db.del('customers', c.id); removed++; }
  }

  if (Array.isArray(pkg.calls)) {
    const localCalls = await listCalls();

    const inIds = new Set(pkg.calls.map((c) => c.id));
    await db.putMany('calls', pkg.calls.map((c) => ({ ...mergeCall(cById.get(c.id), c, true), synced: true })));
    for (const c of localCalls) if (c.synced && !inIds.has(c.id)) await db.del('calls', c.id);
    calls = pkg.calls.length;
  }
  // 템플릿: 없는 것만 추가
  const tpls = await db.all('templates');
  const haveIds = new Set(tpls.map((t) => t.id));
  const newTpls = (pkg.templates || []).filter((t) => t && t.id && !haveIds.has(t.id));
  if (newTpls.length) await db.putMany('templates', newTpls);

    mode: 'staff', me: pkg.staff, leadName: pkg.leadName || s.leadName,
    agentName: s.agentName || pkg.staff.name,
    sites: pkg.settings?.sites || s.sites, cycles: pkg.settings?.cycles || s.cycles,
    callKinds: pkg.settings?.callKinds || s.callKinds,
    defaultAddress: s.defaultAddress || pkg.settings?.defaultAddress || '',
    lastAssignAt: nowISO(), seeded: true,
  });
  return { added, updated, removed, calls };
}

/** (팀장) 직원 보고 파일 불러오기 */
async function importReport(pkg) {
  const s = await getSettings();
  let staff = s.staff.find((x) => x.id === pkg.staff?.id);

  }

  let added = 0, updated = 0;
  const out = pkg.customers.map((c) => {
    const cur = local.get(c.id);

    staff: s.staff,

// ---- 엑셀(CSV) 가져오기 ----
async function decodeFile(file) {

    return new TextDecoder('euc-kr').decode(buf); // 엑셀 기본 CSV(한글 윈도우)
  }
}

function parseCSV(text) {
  const rows = []; let row = []; let cell = ''; let q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === ',' || ch === '\t') { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter((r) => r.some((x) => x.trim()));
}

const HEAD = {
  name: ['이름', '고객명', '성명', '손님'], phone: ['연락처', '전화번호', '휴대폰', '핸드폰', '번호'],
  site: ['현장', '현장명'], unitType: ['관심타입', '타입', '평형', '관심평형'], unit: ['동호수', '동·호수', '호수'],
  grade: ['등급'], source: ['유입경로', '유입'], firstDate: ['최초상담일', '상담일', '등록일'], lastContact: ['최근접촉일'],
  nextDate: ['다음관리일', '관리일'], visitDate: ['방문일', '방문예약일'], visitTime: ['방문시간'], tags: ['태그'],
  memo: ['관리메모', '메모', '비고'], owner: ['담당', '담당자', '담당직원', '직원'],
};
const normDate = (v) => {
  const m = String(v || '').trim().match(/^(\d{4})[.\-/년\s]*(\d{1,2})[.\-/월\s]*(\d{1,2})/);
  return m ? `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}` : '';
};

/** CSV 파일 → 미리보기용 결과 (저장은 commitCSV) */
async function previewCSV(file) {
  const rows = parseCSV(await decodeFile(file));
  if (rows.length < 2) throw new Error('내용이 없습니다');
  const head = rows[0].map((h) => h.replace(/\s/g, ''));
  const col = {};
  Object.entries(HEAD).forEach(([k, names]) => { const i = head.findIndex((h) => names.includes(h)); if (i >= 0) col[k] = i; });
  if (col.name === undefined || col.phone === undefined) throw new Error('첫 줄에 "이름"과 "연락처" 열이 있어야 합니다');

  const out = [];
  for (const r of rows.slice(1)) {
    const g = (k) => (col[k] !== undefined ? (r[col[k]] || '').trim() : '');

      name: g('name'), phone: formatPhone(g('phone')), site: g('site'), unitType: g('unitType'), unit: g('unit'),

    ...r, id: uid(), phoneDigits: digitsOnly(r.phone), owner: r.owner || owner,
    history: [{ id: uid(), date: r.firstDate || today(), kind: '상담', text: '엑셀에서 가져옴' }],
    schedule: [], docs: [], createdAt: now, updatedAt: now,

    return `<button class="${cls}" data-d="${ymd}" aria-label="${fmtShort(ymd)} 일정 ${ev.length}건"><span class="n">${d.getDate()}</span>${inner}</button>`;
  };

  const selEv = byDate[st.sel] || [];
  const monthEv = Object.entries(byDate).filter(([d]) => d.startsWith(st.ym)).flatMap(([, v]) => v);
  const mc = (tp) => monthEv.filter((e) => e.type === tp).length;
  const evRow = (e) => `<a class="ag-row ${e.done ? 'muted' : ''}" href="#/c/${e.c.id}">
      <span class="ev-tag ${e.type}">${TYPE[e.type]}</span>
      <span class="ag-body"><b>${e.time ? esc(e.time) + ' ' : ''}${esc(e.c.name)}${e.type !== 'visit' ? ` · ${esc(e.label)}` : ''}</b>
        <small>${esc([e.c.site, e.c.unit || e.c.unitType, fmtMoney(e.amount)].filter(Boolean).join(' · '))}</small></span>
      ${lead ? ownerChip(staffName(s, e.c.owner), !e.c.owner) : ''}${e.done ? '<span class="ok-txt">✓</span>' : ''}</a>`;
  const careList = selEv.filter((e) => e.type === 'care').map((e) => e.c);
  const otherEv = selEv.filter((e) => e.type !== 'care');

  el.innerHTML = `
    <div class="page-head"><h1>캘린더</h1><button class="btn btn-sm" id="today">오늘</button></div>
    ${tabs}
    <div class="cal-layout">
    <div>
      <div class="cal-head">
        <button class="icon-btn" id="prev" aria-label="이전 달">${icon('left')}</button>
        <div style="text-align:center"><div class="title">${y}년 ${m}월</div>
          <div class="legend"><span><i class="dot-visit"></i>방문 ${mc('visit')}</span><span><i class="dot-pay"></i>입금 ${mc('pay')}</span><span><i class="dot-contract"></i>계약·서류 ${mc('contract')}</span><span><i class="dot-care"></i>관리 ${mc('care')}</span></div></div>
        <button class="icon-btn" id="next" aria-label="다음 달">${icon('right')}</button>
      </div>
      <div class="cal ${wide ? 'wide' : ''}" id="cal">
        ${['일', '월', '화', '수', '목', '금', '토'].map((w, i) => `<div class="wd ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${w}</div>`).join('')}
        ${cells.map(dayCell).join('')}
      </div>
    </div>
    <div>
      <div class="section-title">${fmtShort(st.sel)}${st.sel === t ? ' · 오늘' : ''} <span class="cnt">${selEv.length}건</span></div>
      ${otherEv.length ? `<div class="section">${otherEv.map(evRow).join('')}</div>` : ''}
      ${careList.length ? `<div class="section-title" style="font-size:14px">관리 예정 <span class="cnt">${careList.length}</span></div>
        ${wide ? selEv.filter((e) => e.type === 'care').map(evRow).join('')
          : `<div id="sel">${careList.map((c) => customerCard(c, lead ? { owner: staffName(s, c.owner) } : {})).join('')}</div>`}` : ''}
      ${!selEv.length ? '<div style="color:var(--text-3);font-size:14px;padding:6px 2px 20px">이 날 일정이 없습니다</div>' : ''}
    </div>
    </div>`;

  const shift = (k) => { const d = parseYMD(st.ym + '-01'); d.setMonth(d.getMonth() + k); st.ym = toYMD(d).slice(0, 7); ctx.rerender(); };
  el.querySelector('#prev').onclick = () => shift(-1);
  el.querySelector('#next').onclick = () => shift(1);
  el.querySelector('#today').onclick = () => { st.ym = t.slice(0, 7); st.sel = t; ctx.rerender(); };
  el.querySelectorAll('[data-d]').forEach((b) => {
    b.onclick = () => { st.sel = b.dataset.d; if (!st.sel.startsWith(st.ym)) st.ym = st.sel.slice(0, 7); ctx.rerender(); };
  });
  const cal = el.querySelector('#cal');
  let sx = null;
  cal.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; }, { passive: true });
  cal.addEventListener('touchend', (e) => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 60) shift(dx < 0 ? 1 : -1);
  });
  const sel = el.querySelector('#sel');
  if (sel) bindCards(sel, ctx.rerender);
  bindSiteTabs(el, ctx.rerender);
}

Object.assign(__exp, { render });
};

__defs['views/calls'] = function (__exp) {
// 콜 배분
// (팀장) 새 콜 입력 → 담당 직원 지정 / 처리 안 된 콜 / 직원별·콜 종류별 성과 / 콜 목록
// (직원) 받은 콜: 전화 걸고 결과 입력, 고객으로 등록
const { getSettings } = __req('db');
const { listCalls, saveCall, deleteCall, findPhoneDup, stageOf, rankOf, RESULTS, resultLabel, convertToCustomer, periodStart, tally, customersById, isStale } = __req('calls');
const { esc, today, fmtShort, relTime, formatPhone, digitsOnly, smsLink, debounce } = __req('utils');
const { icon, go, toast, openSheet, confirmSheet, ownerChip, emptyState } = __req('ui');
const { staffName } = __req('team');

const ui = { period: 'month', who: '', kind: '', res: '', lastKind: '', staffTab: 'todo' };
const PERIODS = [['today', '오늘'], ['week', '이번 주'], ['month', '이번 달'], ['all', '전체']];
const md = (ymd) => (ymd ? `${+ymd.slice(5, 7)}/${+ymd.slice(8, 10)}` : '');
const hhmm = (iso) => (iso ? new Date(iso).toTimeString().slice(0, 5) : '');
const resCls = (k) => ({ '': 'todo', 부재: 'miss', 통화: 'reach', 방문예약: 'resv', 방문: 'visit', 계약: 'done', 무효: 'void' }[k || '']);
const resBadge = (k) => `<span class="res r-${resCls(k)}">${esc(resultLabel(k))}</span>`;

async function render(el, ctx) {
  const s = await getSettings();
  const calls = await listCalls();
  const custById = await customersById();
  if (s.mode === 'staff') return renderStaff(el, ctx, s, calls, custById);
  return renderLead(el, ctx, s, calls, custById);
}

// =============================== 팀장 · 혼자 ===============================
function renderLead(el, ctx, s, calls, custById) {
  const lead = s.mode === 'lead' && s.staff.length > 0;
  const t = today();
  const kinds = s.callKinds?.length ? s.callKinds : ['콜'];
  if (!kinds.includes(ui.lastKind)) ui.lastKind = kinds[0];

  // 담당 추천: 오늘 받은 콜이 가장 적은 직원 (같으면 이번 달 적은 직원)
  const ms = t.slice(0, 7) + '-01';
  const cnt = (id, from) => calls.filter((c) => c.owner === id && c.date >= from).length;
  const ranked = [...s.staff].sort((a, b) => cnt(a.id, t) - cnt(b.id, t) || cnt(a.id, ms) - cnt(b.id, ms));
  const suggest = ranked[0]?.id || '';
  if (!s.staff.some((x) => x.id === ui.pick)) ui.pick = suggest;

  const from = periodStart(ui.period);
  const inPeriod = calls.filter((c) => !from || c.date >= from);
  const stale = calls.filter(isStale).sort((a, b) => a.at.localeCompare(b.at));
  const stage = (c) => stageOf(c, custById);

  // 성과표
  const statRow = (label, list, extra = '') => {
    const o = tally(list, custById);
    return `<tr${extra}><td><b>${label}</b></td><td class="num"><b>${o.n}</b></td>
      <td class="num">${o.todo ? `<span class="danger-txt">${o.todo}</span>` : '<span class="zero">0</span>'}</td>
      <td class="num">${o.reach}</td><td class="num accent-txt">${o.visit}</td><td class="num ok-txt">${o.contract}</td>
      <td class="num">${o.n - o.invalid ? `${o.visitRate}%` : '-'}</td><td class="num">${o.n - o.invalid ? `${o.contractRate}%` : '-'}</td></tr>`;
  };
  const statHead = (first) => `<thead><tr><th>${first}</th><th class="num">받은 콜</th><th class="num">미처리</th><th class="num">통화</th><th class="num">방문</th><th class="num">계약</th><th class="num">방문율</th><th class="num">계약율</th></tr></thead>`;
  const staffRows = s.staff.map((st) => statRow(`<button class="link" data-fwho="${st.id}">${esc(st.name)}</button>`, inPeriod.filter((c) => c.owner === st.id)));
  if (inPeriod.some((c) => !c.owner)) staffRows.push(statRow('미배정', inPeriod.filter((c) => !c.owner)));
  const kindNames = [...new Set([...kinds, ...inPeriod.map((c) => c.kind)])].filter((k) => inPeriod.some((c) => c.kind === k));
  const kindRows = kindNames.map((k) => statRow(`<button class="link" data-fkind="${esc(k)}">${esc(k)}</button>`, inPeriod.filter((c) => c.kind === k)));
  const total = statRow('합계', inPeriod, ' class="total"');

  // 목록 필터
  const list = inPeriod.filter((c) => (!ui.who || (ui.who === '-' ? !c.owner : c.owner === ui.who))
    && (!ui.kind || c.kind === ui.kind) && (!ui.res || (ui.res === 'todo' ? !c.result : stage(c) === ui.res)));
  const pLabel = PERIODS.find((p) => p[0] === ui.period)[1];

  el.innerHTML = `
    <div class="page-head"><h1>${lead ? '콜 배분' : '콜 기록'}</h1><span class="sub">${fmtShort(t)}</span></div>

    <section class="panel call-form">
      <div class="panel-head">${icon('phone', 'sm')} 새 콜 입력 <span class="hint">${lead ? '입력하면 바로 담당 직원 앞으로 기록됩니다' : '들어온 콜을 기록하세요'}</span></div>
      <div class="chips wrap" id="kinds">${kinds.map((k) => `<button type="button" class="chip ${k === ui.lastKind ? 'on' : ''}" data-kind="${esc(k)}">${esc(k)}</button>`).join('')}</div>
      <form id="cf" autocomplete="off">
        <div class="cf-grid">
          <input class="input" name="phone" inputmode="tel" placeholder="연락처 (필수)" aria-label="연락처" required>
          <input class="input" name="name" placeholder="이름 (모르면 비워두기)" aria-label="이름">
          <input class="input cf-memo" name="memo" placeholder="관심 평형·메모 (예: 84 관심, 저층 원함)" aria-label="메모">
        </div>
        <div class="cf-dup hidden" id="cdup"></div>
        ${lead ? `<div class="cf-owner"><span class="lbl">담당</span><div class="chips wrap" id="owners">${s.staff.map((st) => `<button type="button" class="chip ${st.id === ui.pick ? 'on' : ''}" data-owner="${st.id}">${esc(st.name)} <small>오늘 ${cnt(st.id, t)}</small>${st.id === suggest ? ' <small class="sug">적음</small>' : ''}</button>`).join('')}</div></div>` : ''}
        <button class="btn btn-primary cf-go" type="submit">${icon('send', 'sm')} ${lead ? '콜 주기' : '기록하기'}</button>
      </form>
      ${s.mode === 'lead' && !s.staff.length ? `<a class="card notice" href="#/settings" style="margin-top:10px">${icon('users', 'sm')} 설정에서 직원을 등록하면 콜을 직원에게 나눠줄 수 있습니다</a>` : ''}
    </section>

    ${stale.length ? `<section class="panel alert">
      <div class="panel-head">${icon('alert', 'sm')} 처리 안 된 콜 <span class="cnt">${stale.length}</span><span class="hint">준 지 하루 넘게 결과가 없는 콜</span></div>
      <div class="al">${stale.map((c) => `<div class="al-row danger" data-call="${c.id}">
        <span class="dd-txt over">${relTime(c.at)}</span>
        <span class="al-main"><b>${esc(c.name || '이름 미상')}</b> <small>${esc(c.kind)} · ${esc(c.phone)}</small></span>
        ${lead ? ownerChip(staffName(s, c.owner), !c.owner) : ''}<span class="chev">${icon('right', 'sm')}</span></div>`).join('')}</div>
      ${lead ? '<p class="panel-note">직원이 보고 파일을 보내야 결과가 들어옵니다. 오래된 콜은 눌러서 다른 직원에게 다시 줄 수 있습니다.</p>' : ''}
    </section>` : ''}

    <div class="chips period">${PERIODS.map(([k, l]) => `<button class="chip ${ui.period === k ? 'on' : ''}" data-period="${k}">${l}</button>`).join('')}</div>

    ${inPeriod.length ? `<div class="call-stats">
      ${lead ? `<section class="panel"><div class="panel-head">${icon('users', 'sm')} 직원별 성과 <span class="hint">${pLabel}</span></div>
        <div class="tbl-wrap"><table class="tbl cstat">${statHead('직원')}<tbody>${staffRows.join('')}${total}</tbody></table></div></section>` : ''}
      <section class="panel"><div class="panel-head">${icon('phone', 'sm')} 콜 종류별 성과 <span class="hint">${pLabel}</span></div>
        <div class="tbl-wrap"><table class="tbl cstat">${statHead('종류')}<tbody>${kindRows.join('')}${total}</tbody></table></div></section>
    </div>

      <div class="list-filter">
        ${lead ? `<select class="input sm-in" id="f-who"><option value="">전체 직원</option>${s.staff.map((x) => `<option value="${x.id}" ${ui.who === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}<option value="-" ${ui.who === '-' ? 'selected' : ''}>미배정</option></select>` : ''}
        <select class="input sm-in" id="f-kind"><option value="">전체 종류</option>${kindNames.concat(ui.kind && !kindNames.includes(ui.kind) ? [ui.kind] : []).map((k) => `<option ${ui.kind === k ? 'selected' : ''}>${esc(k)}</option>`).join('')}</select>
        <select class="input sm-in" id="f-res"><option value="">전체 결과</option><option value="todo" ${ui.res === 'todo' ? 'selected' : ''}>미처리</option>${RESULTS.filter((r) => r.k).map((r) => `<option value="${r.k}" ${ui.res === r.k ? 'selected' : ''}>${r.label}</option>`).join('')}</select>
        ${ui.who || ui.kind || ui.res ? '<button class="btn btn-sm" id="f-clear">필터 해제</button>' : ''}
      </div>
      ${list.length ? `<div class="call-list">${list.slice(0, 300).map((c) => {
        const st = stage(c);
        return `<div class="cl-row ${st === '무효' ? 'void' : ''}" data-call="${c.id}">
          <span class="cl-when"><b>${c.date === t ? '오늘' : md(c.date)}</b><small>${hhmm(c.at)}</small></span>
          <span class="kind">${esc(c.kind)}</span>
          <span class="cl-main"><b>${esc(c.name || '이름 미상')}</b> <small>${esc(c.phone)}</small>${c.memo ? `<em>${esc(c.memo)}</em>` : ''}</span>
          ${lead ? ownerChip(staffName(s, c.owner), !c.owner) : ''}
          ${resBadge(st)}${c.customerId && custById.has(c.customerId) ? '<span class="cl-linked" title="고객 카드 있음">고객</span>' : '<span class="cl-linked"></span>'}</div>`;
      }).join('')}</div>${list.length > 300 ? '<p class="panel-note">최근 300건만 보입니다. 기간이나 필터를 좁혀 보세요.</p>' : ''}`
      : `<div class="panel-empty">${calls.length ? '조건에 맞는 콜이 없습니다' : '아직 입력한 콜이 없습니다. 위에서 첫 콜을 입력해 보세요.'}</div>`}
    </section>`;

  // ---- 입력 ----
  const f = el.querySelector('#cf');
  const dupEl = el.querySelector('#cdup');
  el.querySelectorAll('[data-kind]').forEach((b) => {
    b.onclick = () => { ui.lastKind = b.dataset.kind; el.querySelectorAll('[data-kind]').forEach((x) => x.classList.toggle('on', x === b)); };
  });
  el.querySelectorAll('[data-owner]').forEach((b) => {
    b.onclick = () => { ui.pick = b.dataset.owner; el.querySelectorAll('[data-owner]').forEach((x) => x.classList.toggle('on', x === b)); };
  });
  const checkDup = debounce(async () => {
    const { calls: dc, customer } = await findPhoneDup(f.phone.value);
    const msg = [];
    if (dc.length) { const d = dc[0]; msg.push(`이미 받은 콜입니다: ${fmtShort(d.date)} ${esc(d.kind)} → ${esc(staffName(s, d.owner))}${dc.length > 1 ? ` 외 ${dc.length - 1}건` : ''}`); }
    if (customer) msg.push(`이미 고객입니다: <a href="#/c/${customer.id}">${esc(customer.name)}</a> (${esc(staffName(s, customer.owner))} 담당)`);
    dupEl.innerHTML = msg.join('<br>');
    dupEl.classList.toggle('hidden', !msg.length);
  }, 250);
  f.phone.addEventListener('input', () => {
    const v = formatPhone(f.phone.value);
    if (v !== f.phone.value) f.phone.value = v;
    checkDup();
  });
  f.onsubmit = async (e) => {
    e.preventDefault();

    el.querySelector('#cf')?.phone.focus();
  };

  // ---- 필터·목록 ----
  el.querySelectorAll('[data-period]').forEach((b) => { b.onclick = () => { ui.period = b.dataset.period; ctx.rerender(); }; });
  el.querySelector('#f-who')?.addEventListener('change', (e) => { ui.who = e.target.value; ctx.rerender(); });
  el.querySelector('#f-kind').onchange = (e) => { ui.kind = e.target.value; ctx.rerender(); };
  el.querySelector('#f-res').onchange = (e) => { ui.res = e.target.value; ctx.rerender(); };
  el.querySelector('#f-clear')?.addEventListener('click', () => { ui.who = ''; ui.kind = ''; ui.res = ''; ctx.rerender(); });
  el.querySelectorAll('[data-fwho]').forEach((b) => { b.onclick = () => { ui.who = b.dataset.fwho; ui.kind = ''; ctx.rerender(); }; });
  el.querySelectorAll('[data-fkind]').forEach((b) => { b.onclick = () => { ui.kind = b.dataset.fkind; ui.who = ''; ctx.rerender(); }; });
  bindCallRows(el, ctx, s, calls, custById);
}

// =============================== 직원 ===============================
function renderStaff(el, ctx, s, calls, custById) {
  const mine = calls.filter((c) => !c.owner || c.owner === s.me?.id);
  const stage = (c) => stageOf(c, custById);
  const todo = mine.filter((c) => rankOf(c.result) <= 1 && c.result !== '무효');
  const doneL = mine.filter((c) => !todo.includes(c));
  const shown = ui.staffTab === 'todo' ? todo : ui.staffTab === 'done' ? doneL : mine;
  const o = tally(mine.filter((c) => c.date >= today().slice(0, 7) + '-01'), custById);

  el.innerHTML = `
    <div class="page-head"><h1>받은 콜</h1><span class="sub">이번 달 ${o.n}건 · 방문 ${o.visit} · 계약 ${o.contract}</span></div>
    <div class="seg" id="stab">
      <button class="${ui.staffTab === 'todo' ? 'on' : ''}" data-t="todo">처리 전 ${todo.length}</button>
      <button class="${ui.staffTab === 'done' ? 'on' : ''}" data-t="done">처리함 ${doneL.length}</button>
      <button class="${ui.staffTab === 'all' ? 'on' : ''}" data-t="all">전체 ${mine.length}</button>
    </div>
    <div class="call-cards">
      ${shown.length ? shown.map((c) => `<div class="call-card ${isStale(c) ? 'stale' : ''}" data-call="${c.id}">
          <div class="cc-top"><span class="kind">${esc(c.kind)}</span><span class="cc-when">${relTime(c.at)} ${hhmm(c.at)}</span>${resBadge(stage(c))}</div>
          <div class="cc-name"><b>${esc(c.name || '이름 미상')}</b> <span>${esc(c.phone)}</span></div>
          ${c.memo ? `<div class="cc-memo">${esc(c.memo)}</div>` : ''}
          <div class="cc-act">
            <a class="btn btn-sm" href="tel:${digitsOnly(c.phone)}">${icon('phone', 'sm')} 전화</a>
            <a class="btn btn-sm" href="${smsLink(c.phone)}">${icon('message', 'sm')} 문자</a>
            <button class="btn btn-sm btn-primary" data-open="${c.id}">결과 입력</button>
          </div></div>`).join('')
      : emptyState('📞', ui.staffTab === 'todo' ? '처리할 콜이 없습니다' : '콜이 없습니다', '팀장님이 준 콜은 배정 파일을 불러오면 여기에 들어옵니다. 통화 후 결과를 입력하고, 보고 파일을 보내면 팀장님 화면에 반영됩니다.')}
    </div>`;
  el.querySelectorAll('#stab [data-t]').forEach((b) => { b.onclick = () => { ui.staffTab = b.dataset.t; ctx.rerender(); }; });
  bindCallRows(el, ctx, s, calls, custById);
}

function bindCallRows(el, ctx, s, calls, custById) {
  el.querySelectorAll('[data-call]').forEach((r) => {
    r.onclick = (e) => {
      if (e.target.closest('a,button:not([data-open])')) return;
      const c = calls.find((x) => x.id === r.dataset.call);
      if (c) callSheet(c, s, custById, ctx.rerender);
    };
  });
}

// =============================== 콜 상세 시트 ===============================
function callSheet(c, s, custById, onChange) {
  const lead = s.mode === 'lead';
  const staff = s.mode === 'staff';
  const cust = c.customerId && custById.get(c.customerId);
  const st = stageOf(c, custById);
  let res = c.result || '';
  const { el, close } = openSheet(`
    <h2>${esc(c.name || '이름 미상')} <span class="kind">${esc(c.kind)}</span></h2>
    <p class="sheet-sub">${esc(c.phone)} · ${fmtShort(c.date)} ${hhmm(c.at)}${lead ? ` · ${esc(staffName(s, c.owner))}` : ''}</p>
    <div class="btn-row" style="margin-bottom:14px">
      <a class="btn" href="tel:${digitsOnly(c.phone)}">${icon('phone', 'sm')} 전화</a>
      <a class="btn" href="${smsLink(c.phone)}">${icon('message', 'sm')} 문자</a></div>
    <div class="field"><label>결과</label>
      <div class="seg res-seg" id="cs-res">${RESULTS.map((r) => `<button type="button" class="${res === r.k ? 'on' : ''}" data-r="${r.k}">${r.label}</button>`).join('')}</div>
      ${st !== res && cust ? `<div class="hint">고객 카드 기준으로는 <b>${esc(resultLabel(st))}</b>까지 진행되어 성과에 그렇게 반영됩니다</div>` : ''}</div>
    <div class="field"><label>이름</label><input id="cs-name" value="${esc(c.name || '')}" placeholder="이름"></div>
    ${!staff ? `<div class="field"><label>콜 종류</label><select id="cs-kind">${[...new Set([...(s.callKinds || []), c.kind])].filter(Boolean).map((k) => `<option ${k === c.kind ? 'selected' : ''}>${esc(k)}</option>`).join('')}</select></div>` : ''}
    ${lead ? `<div class="field"><label>담당 직원</label><select id="cs-owner"><option value="">미배정</option>${s.staff.map((x) => `<option value="${x.id}" ${x.id === c.owner ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
      <div class="hint">다른 직원에게 넘기면 다음 배정 파일부터 그 직원 폰으로 갑니다</div></div>` : ''}
    <div class="field"><label>메모</label><textarea id="cs-memo" placeholder="통화 내용, 관심 평형 등">${esc(c.memo || '')}</textarea></div>
    <div class="btn-row">
      ${cust ? `<a class="btn" href="#/c/${cust.id}">고객 카드 보기</a>` : `<button class="btn" id="cs-conv">${icon('plus', 'sm')} 고객으로 등록</button>`}
      <button class="btn btn-primary" id="cs-save">저장</button></div>
    ${!staff || !c.synced ? '<div style="text-align:center;margin-top:12px"><button class="link danger-txt" id="cs-del">이 콜 삭제</button></div>' : ''}`);

  el.querySelectorAll('#cs-res [data-r]').forEach((b) => {
    b.onclick = () => { res = b.dataset.r; el.querySelectorAll('#cs-res [data-r]').forEach((x) => x.classList.toggle('on', x === b)); };
  });
  const collect = () => ({
    ...c, result: res, resultAt: res !== (c.result || '') ? new Date().toISOString() : c.resultAt || '',
    name: el.querySelector('#cs-name').value.trim(), memo: el.querySelector('#cs-memo').value.trim(),
    kind: el.querySelector('#cs-kind')?.value || c.kind,
    owner: el.querySelector('#cs-owner') ? el.querySelector('#cs-owner').value : c.owner,
  });
  el.querySelector('#cs-save').onclick = async () => {
    const rec = await saveCall(collect());
    close();
    if (!rec.customerId && rankOf(rec.result) >= 2) {
      toast(`${resultLabel(rec.result)}으로 저장했습니다`, { label: '고객 등록', run: async () => { const cu = await convertToCustomer(rec, s); go(`#/c/${cu.id}`); } });
    } else toast('저장했습니다');
    onChange();
  };
  el.querySelector('#cs-conv')?.addEventListener('click', async () => {
    const data = collect();
    const rec = await saveCall(data);
    const cu = await convertToCustomer(rec, s);
    close();
    toast(`${cu.name} 고객 카드를 만들었습니다 · 방문 예약을 잡아보세요`);
    go(`#/c/${cu.id}`);
  });
  el.querySelector('#cs-del')?.addEventListener('click', async () => {
    close();
    if (!(await confirmSheet({ title: '이 콜을 삭제할까요?', message: '콜 기록과 성과 집계에서 빠집니다. 고객 카드는 남습니다.', ok: '삭제', danger: true }))) return;
    await deleteCall(c.id);
    toast('콜을 삭제했습니다'); onChange();
  });
}

Object.assign(__exp, { render });
};

__defs['views/customers'] = function (__exp) {
// 고객 목록: 통합 검색, 등급·유입경로·담당 필터, 정렬, 현장 탭, (팀장) 일괄 배정
const { getSettings, db } = __req('db');
const { listCustomers, liveHistory } = __req('store');
const { esc, digitsOnly, GRADES, SOURCES, debounce, fmtShort, nowISO, isWide } = __req('utils');
const { icon, go, toast, siteTabs, bindSiteTabs, ddayBadge, gradeBadge, ownerChip, emptyState } = __req('ui');
const { visibleCustomers, staffName } = __req('team');

const KEY = 'listFilter';
const load = () => { try { return JSON.parse(sessionStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
const save = (f) => { try { sessionStorage.setItem(KEY, JSON.stringify(f)); } catch (e) { /* 무시 */ } };

async function render(el, ctx) {
  const s = await getSettings();
  const lead = s.mode === 'lead';
  const all = visibleCustomers(await listCustomers(), s);
  const { html: tabs, filtered: bySite } = await siteTabs(all);
  const f = { q: '', grade: '', source: '', owner: '', sort: 'next', ...load() };
  const selected = new Set();

  el.innerHTML = `
    <div class="page-head"><h1>고객</h1><span class="sub">${all.length}명</span>
      ${isWide() ? `<a class="btn btn-sm btn-primary" href="#/new">${icon('plus', 'sm')} 고객 등록</a>` : ''}</div>
    ${tabs}
    <div class="list-tools">
      <div class="search">${icon('search')}<input id="q" type="search" placeholder="이름, 번호, 메모, 태그 검색" value="${esc(f.q)}" autocomplete="off"></div>
      <div class="filters ${lead ? 'four' : ''}">
        <select id="f-grade" aria-label="등급"><option value="">등급 전체</option>${GRADES.map((g) => `<option ${f.grade === g ? 'selected' : ''}>${g}</option>`).join('')}</select>
        <select id="f-source" aria-label="유입경로"><option value="">유입 전체</option>${SOURCES.map((x) => `<option ${f.source === x ? 'selected' : ''}>${x}</option>`).join('')}</select>
        ${lead ? `<select id="f-owner" aria-label="담당"><option value="">담당 전체</option><option value="-" ${f.owner === '-' ? 'selected' : ''}>미배정</option>${s.staff.map((x) => `<option value="${x.id}" ${f.owner === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>` : ''}
        <select id="f-sort" aria-label="정렬">
          <option value="next" ${f.sort === 'next' ? 'selected' : ''}>관리일순</option>
          <option value="recent" ${f.sort === 'recent' ? 'selected' : ''}>최근등록순</option>
          <option value="grade" ${f.sort === 'grade' ? 'selected' : ''}>등급순</option>
          <option value="name" ${f.sort === 'name' ? 'selected' : ''}>이름순</option>
        </select>
      </div>
    </div>
    <div class="bulk hidden" id="bulk">
      <b id="bulk-n"></b>
      <select id="bulk-owner"><option value="">담당 직원 선택</option><option value="-">미배정으로</option>${s.staff.map((x) => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select>
      <button class="btn btn-sm btn-primary" id="bulk-go">배정</button>
      <button class="btn btn-sm" id="bulk-x">선택 해제</button>
    </div>
    <div id="results"></div>`;

  const results = el.querySelector('#results');
  const bulk = el.querySelector('#bulk');
  const updBulk = () => {
    bulk.classList.toggle('hidden', !selected.size);
    el.querySelector('#bulk-n').textContent = `${selected.size}명 선택`;
  };

  let current = [];
  const draw = () => {
    const q = f.q.trim().toLowerCase();
    const qd = digitsOnly(q);
    let list = bySite.filter((c) => {
      if (f.grade && c.grade !== f.grade) return false;
      if (f.source && c.source !== f.source) return false;
      if (lead && f.owner && (f.owner === '-' ? c.owner : c.owner !== f.owner)) return false;
      if (!q) return true;
      if (qd.length >= 3 && (c.phoneDigits || '').includes(qd)) return true;
      const hay = [c.name, c.memo, c.unitType, c.unit, c.site, lead ? staffName(s, c.owner) : '', ...(c.tags || []), ...liveHistory(c).map((h) => h.text)].join(' ').toLowerCase();
      return hay.includes(q);
    });
    const gi = (g) => { const i = GRADES.indexOf(g); return i < 0 ? 99 : i; };
    const sorters = {
      next: (a, b) => (a.nextDate || '9999').localeCompare(b.nextDate || '9999'),
      recent: (a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''),
      grade: (a, b) => gi(a.grade) - gi(b.grade) || (a.nextDate || '9999').localeCompare(b.nextDate || '9999'),
      name: (a, b) => a.name.localeCompare(b.name, 'ko'),
    };
    list = list.sort(sorters[f.sort] || sorters.next);
    current = list;

    if (!all.length) {
      results.innerHTML = emptyState('👋', '첫 고객을 등록해 보세요', '+ 버튼으로 고객을 추가하거나, 설정에서 샘플 고객을 넣어볼 수 있습니다.',
        `<a class="btn btn-primary" href="#/new">${icon('plus')} 고객 등록</a>`);
      return;
    }
    if (!list.length) { results.innerHTML = emptyState('🔍', '검색 결과가 없습니다', '검색어나 필터를 바꿔 보세요.'); return; }

    if (isWide()) {
      // PC: 표
      results.innerHTML = `<div class="list-count">${list.length}명</div>
        <div class="tbl-wrap panel" style="padding:0"><table class="tbl clickable"><thead><tr>
          ${lead ? '<th style="width:36px"><input type="checkbox" id="all-chk" aria-label="전체 선택"></th>' : ''}
          <th>관리일</th><th>이름</th><th>연락처</th><th>현장 · 타입</th>${lead ? '<th>담당</th>' : ''}<th>유입</th><th>최근 접촉</th><th>방문 예약</th><th>메모</th></tr></thead><tbody>
          ${list.map((c) => `<tr data-id="${c.id}">
            ${lead ? `<td><input type="checkbox" data-chk="${c.id}" ${selected.has(c.id) ? 'checked' : ''}></td>` : ''}
            <td>${ddayBadge(c.nextDate, true)}</td><td><b>${esc(c.name)}</b> ${gradeBadge(c.grade)}</td><td>${esc(c.phone)}</td>
            <td>${esc([c.site, c.unitType, c.unit].filter(Boolean).join(' · '))}</td>
            ${lead ? `<td>${ownerChip(staffName(s, c.owner), !c.owner)}</td>` : ''}
            <td>${esc(c.source || '')}</td><td class="sm">${c.lastContact ? fmtShort(c.lastContact) : '-'}</td>
            <td class="sm">${c.visitDate ? `${fmtShort(c.visitDate)} ${esc(c.visitTime || '')}` : ''}</td>
            <td class="sm ellipsis">${esc((liveHistory(c)[0] || {}).text || c.memo || '')}</td></tr>`).join('')}
        </tbody></table></div>`;
    } else {
      results.innerHTML = `<div class="list-count">${list.length}명</div>` + list.map((c) => `
        <div class="row" data-id="${c.id}">
          <div class="body">
            <div class="name">${esc(c.name)} ${gradeBadge(c.grade)}${lead ? ownerChip(staffName(s, c.owner), !c.owner) : ''}</div>
            <div class="meta">${esc(c.phone)}${c.site ? ' · ' + esc(c.site) : ''}${c.unitType ? ' · ' + esc(c.unitType) : ''}</div>
          </div>
          ${ddayBadge(c.nextDate, true)}
        </div>`).join('');
    }
    results.querySelectorAll('[data-id]').forEach((r) => {
      r.onclick = (e) => { if (!e.target.closest('input')) go(`#/c/${r.dataset.id}`); };
    });
    results.querySelectorAll('[data-chk]').forEach((b) => {
      b.onchange = () => { b.checked ? selected.add(b.dataset.chk) : selected.delete(b.dataset.chk); updBulk(); };
    });
    const ac = results.querySelector('#all-chk');
    if (ac) ac.onchange = () => { current.forEach((c) => (ac.checked ? selected.add(c.id) : selected.delete(c.id))); draw(); updBulk(); };
  };

  el.querySelector('#bulk-x').onclick = () => { selected.clear(); draw(); updBulk(); };
  el.querySelector('#bulk-go').onclick = async () => {
    const v = el.querySelector('#bulk-owner').value;
    if (!v) { toast('담당 직원을 고르세요'); return; }
    const owner = v === '-' ? '' : v;
    const now = nowISO();
    const recs = (await listCustomers()).filter((c) => selected.has(c.id)).map((c) => ({ ...c, owner, updatedAt: now }));
    await db.putMany('customers', recs);
    toast(`${recs.length}명을 ${owner ? staffName(s, owner) : '미배정'}(으)로 배정했습니다 · 배정 파일을 다시 보내주세요`);
    ctx.rerender();
  };

  const onQ = debounce(() => { f.q = el.querySelector('#q').value; save(f); draw(); }, 150);
  el.querySelector('#q').addEventListener('input', onQ);
  ['grade', 'source', 'owner', 'sort'].forEach((k) => {
    const sel = el.querySelector(`#f-${k}`);
    if (sel) sel.onchange = (e) => { f[k] = e.target.value; save(f); draw(); };
  });
  bindSiteTabs(el, ctx.rerender);
  draw();
}

Object.assign(__exp, { render });
};

__defs['views/detail'] = function (__exp) {

const { esc, fmtDate, fmtShort, today, addDays, daysLeft, diffDays, ddayLabel, CONTACT_KINDS, SCHEDULE_KINDS, smsLink, fmtMoney, uid } = __req('utils');
const { icon, go, toast, confirmSheet, openSheet, doneSheet, ddayBadge, gradeBadge } = __req('ui');
const { staffName } = __req('team');
const { composeSheet } = __req('views/sms');

async function render(el, ctx) {

  if (!c) { el.innerHTML = '<p class="empty">고객을 찾을 수 없습니다.</p>'; return; }

  el.innerHTML = `
    <div class="page-head">

      <h1 style="font-size:18px">고객 상세</h1>
      <a class="icon-btn" href="#/edit/${c.id}" aria-label="수정">${icon('edit')}</a>
    </div>
    <div class="detail-grid">
    <div class="col">
      <div class="profile">
        <div class="avatar">${esc(c.name.slice(0, 1))}</div>
        <div style="min-width:0;flex:1">
          <div class="nm">${esc(c.name)} ${gradeBadge(c.grade)}</div>
          <div class="ph">${esc(c.phone)}</div>
        </div>
        ${lead ? `<label class="owner-pick">담당<select id="owner"><option value="">미배정</option>${s.staff.map((x) => `<option value="${x.id}" ${c.owner === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></label>` : ''}
      </div>

      <div class="actions">
        <a class="btn" href="tel:${esc(c.phoneDigits)}">${icon('phone')}전화</a>
        <a class="btn" href="${esc(smsLink(c.phone))}">${icon('message')}문자</a>
        <button class="btn btn-soft" id="compose">${icon('send')}문자 생성</button>
        <button class="btn btn-primary" id="done">${icon('check')}관리 완료</button>
      </div>

      <div class="card">
        <div class="next-box">
          ${ddayBadge(c.nextDate)}
          <div>
            <div class="when">${c.nextDate ? `다음 관리 ${fmtDate(c.nextDate)}` : '다음 관리일 미지정'}</div>

          </div>

        ${c.visitDate ? `<div class="visit-box">
            <div><div class="when">${fmtDate(c.visitDate)} ${esc(c.visitTime || '')}</div>
              <div class="sub">${c.visitDone ? '<span class="ok-txt">✓ 방문 완료</span>' : vd === 0 ? '<span class="warn-txt">오늘 방문</span>' : vd > 0 ? `${vd}일 후` : '<span class="danger-txt">방문 여부 미확인</span>'}</div></div>
            ${c.visitDone ? '' : '<button class="btn btn-sm btn-primary" id="visit-done">방문 확인</button>'}
          </div>` : ''}
        <div class="two" style="margin-top:${c.visitDate ? '10px' : '0'}">
          <input type="date" id="v-date" class="input" value="${esc(c.visitDate || '')}" aria-label="방문일">
          <input type="time" id="v-time" class="input" step="600" value="${esc(c.visitTime || '')}" aria-label="방문 시간">
        </div>
        <div class="btn-row" style="margin-top:8px"><button class="btn btn-sm" id="v-save">${c.visitDate ? '예약 변경' : '예약 저장'}</button>${c.visitDate ? '<button class="btn btn-sm" id="v-clear">예약 취소</button>' : ''}</div>
      </div>

      <div class="card">
        <h3>${icon('won', 'sm')} 계약 일정 <span class="cnt-sm">${sched.filter((x) => !x.done).length ? `남은 일정 ${sched.filter((x) => !x.done).length}` : ''}</span></h3>
        ${sched.length ? `<ul class="sched">${sched.map((it) => {
          const d = daysLeft(it.date);
          return `<li class="${it.done ? 'done' : d < 0 ? 'late' : ''}">
            <button class="chk ${it.done ? 'on' : ''}" data-tog="${it.id}" aria-label="${isPayKind(it.kind) ? '입금 확인' : '완료'}">${icon('check', 'sm')}</button>
            <div class="b" data-edit-s="${it.id}"><b>${esc(it.kind)}</b>${it.amount ? ` <span class="amt">${fmtMoney(it.amount)}</span>` : ''}
              <div class="sm">${it.date ? fmtShort(it.date) : '날짜 미정'}${it.done ? ` · ${isPayKind(it.kind) ? '입금 확인' : '완료'} ${it.doneDate ? fmtShort(it.doneDate) : ''}` : ''}${it.memo ? ` · ${esc(it.memo)}` : ''}</div></div>
            ${it.done ? '' : `<span class="dd-txt ${d < 0 ? 'over' : d === 0 ? 'today' : ''}">${ddayLabel(it.date)}</span>`}
          </li>`;
        }).join('')}</ul>` : `<p class="muted-p">${c.grade === '계약' ? '계약금·중도금·잔금 일정을 등록하면 팀장 대시보드에 표시됩니다.' : '계약이 진행되면 일정을 등록하세요.'}</p>`}
        <button class="btn btn-soft btn-block btn-sm" id="add-s">${icon('plus', 'sm')} 일정 추가</button>
      </div>

      long = true;

      await deleteCustomer(c.id);
      toast('삭제했습니다');
      location.replace('#/customers');

/** 계약 일정 추가/수정 시트 */
function scheduleSheet(c, it, onChange) {
  const t = today();
  const cur = it || { kind: c.grade === '계약' ? '계약금 2차' : '계약서 작성', date: t, amount: '', memo: '' };
  const { el, close } = openSheet(`
    <h2>${it ? '일정 수정' : '계약 일정 추가'}</h2>
    <p class="sheet-sub">${esc(c.name)} ${c.unit ? `· ${esc(c.unit)}` : ''}</p>
    <div class="chips wrap" id="sk">${SCHEDULE_KINDS.map((k) => `<button class="chip ${k === cur.kind ? 'on' : ''}" data-k="${k}">${k}</button>`).join('')}</div>
    <div class="two">
      <div class="field"><label>날짜</label><input type="date" id="s-date" value="${esc(cur.date || '')}"></div>
      <div class="field"><label>금액 (만원)</label><input type="number" inputmode="numeric" id="s-amt" value="${esc(cur.amount || '')}" placeholder="2500"></div>
    </div>
    <div class="quick-dates" style="margin:-6px 0 12px">${[0, 7, 14, 30].map((d) => `<button data-d="${d}">${d ? `+${d}일` : '오늘'}</button>`).join('')}</div>
    <div class="field"><label>메모</label><input id="s-memo" value="${esc(cur.memo || '')}" placeholder="예: 가상계좌 입금 예정"></div>
    <button class="btn btn-primary btn-block" id="s-save">저장</button>
    ${it ? '<button class="btn btn-block btn-danger" id="s-del" style="margin-top:8px">일정 삭제</button>' : ''}`);
  let kind = cur.kind;
  el.querySelectorAll('#sk [data-k]').forEach((b) => { b.onclick = () => { kind = b.dataset.k; el.querySelectorAll('#sk [data-k]').forEach((x) => x.classList.toggle('on', x === b)); }; });
  el.querySelectorAll('[data-d]').forEach((b) => { b.onclick = () => { el.querySelector('#s-date').value = addDays(t, Number(b.dataset.d)); }; });
  el.querySelector('#s-save').onclick = async () => {
    const date = el.querySelector('#s-date').value;
    if (!date) { toast('날짜를 고르세요'); return; }
    await upsertSchedule(c.id, { ...(it || {}), kind, date, amount: Number(el.querySelector('#s-amt').value) || 0, memo: el.querySelector('#s-memo').value.trim() });
    close(); toast(`${kind} ${fmtShort(date)} 저장`); onChange();
  };
  const d = el.querySelector('#s-del');
  if (d) d.onclick = async () => { await removeSchedule(c.id, it.id); close(); toast('일정을 삭제했습니다'); onChange(); };
}

Object.assign(__exp, { render });
};

      grade: val.grade, source: val.source,
      firstDate: f.firstDate.value, lastContact: f.lastContact.value, nextDate: f.nextDate.value, visitDate: f.visitDate.value,

      tags: f.tags.value.split(/[,，#]/).map((x) => x.trim()).filter(Boolean),

Object.assign(__exp, { render });
};

__defs['views/home'] = function (__exp) {
